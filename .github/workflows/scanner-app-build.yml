name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'scanner-app/**'
      - '.github/workflows/scanner-app-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure release keystore
        run: |
          KS=scanner-app/app/release.jks
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -alias yizhen \
              -storepass yizhen_rfid_2026 -keypass yizhen_rfid_2026 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=yizhen,O=yizhen,C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KS"
            git commit -m "chore(app): add CI-managed release keystore"
            git push
            echo "keystore generated and committed"
          else
            echo "keystore already present"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: ./scanner-app
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: ./scanner-app
        run: gradle assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rfid-scanner-debug
          path: scanner-app/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rfid-scanner-release
          path: scanner-app/app/build/outputs/apk/release/*.apk
