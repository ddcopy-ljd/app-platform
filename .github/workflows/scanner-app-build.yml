name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'scanner-app/**'
      - '.github/workflows/scanner-app-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: ./scanner-app
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build-debug.log 2>&1
          echo "BUILD_EXIT=$?" >> $GITHUB_ENV
          exit 0

      - name: Show build errors
        working-directory: ./scanner-app
        if: ${{ env.BUILD_EXIT != '0' }}
        run: grep -iE "error|exception|caused by|what went wrong|FAILURE|cannot|unresolved|unsupported" build-debug.log | head -80

      - name: Build Release APK
        working-directory: ./scanner-app
        if: ${{ env.BUILD_EXIT == '0' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Build Log (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: scanner-app/build-debug.log

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rfid-scanner-debug
          path: scanner-app/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rfid-scanner-release
          path: scanner-app/app/build/outputs/apk/release/*.apk
