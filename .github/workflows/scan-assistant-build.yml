name: Build Scan-Assistant APK

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins/jewelry/agents/scan/**'
      - '.github/workflows/scan-assistant-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate release keystore
        run: |
          KS=scanner-app/app/release.jks
          if [ ! -f "$KS" ]; then echo "::error::missing shared keystore $KS"; exit 1; fi
          keytool -list -keystore "$KS" -storetype PKCS12 -storepass yizhen_rfid_2026

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: ./plugins/jewelry/agents/scan
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: ./plugins/jewelry/agents/scan
        run: gradle assembleRelease --no-daemon

      - name: Verify release signature
        working-directory: ./plugins/jewelry/agents/scan
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/app-release.apk)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scan-assistant-debug
          path: plugins/jewelry/agents/scan/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: scan-assistant-release
          path: plugins/jewelry/agents/scan/app/build/outputs/apk/release/*.apk
