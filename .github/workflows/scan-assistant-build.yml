name: Build Scan-Assistant APK

on:
  push:
    branches: [ main ]
    paths:
      - 'scan-assistant/**'
      - '.github/workflows/scan-assistant-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate release keystore
        run: |
          KS=scanner-app/app/release.jks
          if [ ! -f "$KS" ]; then echo "::error::missing shared keystore $KS"; exit 1; fi
          keytool -list -keystore "$KS" -storetype PKCS12 -storepass yizhen_rfid_2026

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: ./scan-assistant
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build-debug.log 2>&1
          echo "BUILD_EXIT=$?" >> $GITHUB_ENV
          exit 0

      - name: Show build errors
        working-directory: ./scan-assistant
        if: ${{ env.BUILD_EXIT != '0' }}
        run: |
          E=$(grep "^e:" build-debug.log | head -30 | cut -c1-220 | tr '\n' '|')
          echo "::error::KOTLIN: $E"
          W=$(grep -A8 "What went wrong" build-debug.log | head -30 | cut -c1-200 | tr '\n' '|')
          echo "::error::WHAT: $W"
          AAPT=$(grep -iE "AAPT|error: |Android resource" build-debug.log | head -20 | cut -c1-200 | tr '\n' '|')
          echo "::error::RES: $AAPT"

      - name: Build gate
        run: |
          if [ "${BUILD_EXIT}" != "0" ]; then echo "Build failed"; exit 1; fi

      - name: Build Release APK
        working-directory: ./scan-assistant
        run: gradle assembleRelease --no-daemon

      - name: Verify release signature
        working-directory: ./scan-assistant
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/app-release.apk)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scan-assistant-debug
          path: scan-assistant/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: scan-assistant-release
          path: scan-assistant/app/build/outputs/apk/release/*.apk
