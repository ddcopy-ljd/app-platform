<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5C2233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="懿臻珠宝云">
<meta name="mobile-web-app-capable" content="yes">
<title>懿臻珠宝云 · 手机版</title>
<link rel="icon" href="../logo/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./app.css?v=20261018b10">
</head>
<body>
<div id="app">
  <div class="phone" :key="ST.lang" v-cloak>

    <!-- ================= 登录 ================= -->
    <div v-if="!ST.token" class="login-page">
      <div class="login-brand">
        <div class="login-logo">懿</div>
        <div class="login-name">{{ t('login.title') }}</div>
        <div class="login-sub">{{ t('login.sub') }}</div>
      </div>
      <div class="login-card">
        <div class="login-field">
          <label>{{ t('login.user') }}</label>
          <input v-model="ST.loginForm.username" autocomplete="username" placeholder="admin" @keyup.enter="login">
        </div>
        <div class="login-field">
          <label>{{ t('login.pass') }}</label>
          <input v-model="ST.loginForm.password" type="password" autocomplete="current-password" placeholder="••••••" @keyup.enter="login">
        </div>
        <button class="btn btn-gold btn-block" :disabled="ST.logging" @click="login">
          {{ ST.logging ? t('common.loading') : t('login.btn') }}
        </button>
      </div>
      <div class="login-tip">{{ t('login.tip') }}</div>
      <div class="login-lang">
        <button v-for="l in LANGS" :key="l" :class="{on: ST.lang === l}" @click="setLang(l)">{{ LANG_LABELS[l] }}</button>
      </div>
    </div>

    <!-- ================= 应用主体 ================= -->
    <template v-else>
      <!-- 顶栏 -->
      <div class="app-bar">
        <div class="app-bar-logo">懿</div>
        <div class="app-bar-title">
          <div class="app-bar-name">{{ t('app.name') }}</div>
          <div class="app-bar-store" @click="ST.sheet = 'store'">
            <span>📍</span><span class="nm">{{ curStoreName() }}</span><span>▾</span>
          </div>
        </div>
        <div class="app-bar-icons">
          <button class="ab-icon" @click="go('dashboard')">
            🔔<span v-if="reminderCount() > 0" class="dot"></span>
          </button>
        </div>
      </div>

      <!-- 运行模式横幅（沙箱/生产运维穿透，NORMAL 不显示） -->
      <div v-if="ST.mode === 'SANDBOX'" class="mode-banner sandbox">🧪 {{ t('mode.sandbox') }}<template v-if="ST.version"> · v{{ ST.version }}</template> · {{ t('mode.sandboxTip') }}</div>
      <div v-else-if="ST.mode === 'PRODUCTION_SUPPORT'" class="mode-banner support">{{ t('support.banner') }}</div>

      <!-- 页面 -->
      <div class="page" @scroll="onScroll">

        <!-- ========== 看板 ========== -->
        <template v-if="ST.sub === '' && ST.tab === 'dashboard'">
          <details class="biz-guide"><summary>📖 {{ t('biz.title') }}</summary><div class="biz-body">{{ t('biz.dashboard') }}</div></details>
          <div class="gold-bar">
            <div class="gb-item" v-if="ST.goldData">
              <span class="gb-label">🌍 {{ t('dash.goldIntl') }}</span>
              <span class="gb-val" v-if="ST.goldData.intlUsd">${{ fmtNum(ST.goldData.intlUsd) }}/oz</span>
              <span class="gb-val gb-fail" v-else @click="loadGold()">{{ t('dash.goldFail') }}</span>
            </div>
            <div class="gb-item" v-if="ST.goldData && ST.goldData.intlPrice">
              <span class="gb-label">📍 {{ t('dash.goldLocal') }}</span>
              <span class="gb-val">{{ ST.goldData.ccySymbol }}{{ fmtNum(ST.goldData.intlPrice) }}/{{ t('misc.gram') }}</span>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat">
              <div class="stat-label">💎 {{ t('dash.onSale') }}</div>
              <div class="stat-value">{{ dStock().count || 0 }}<small>{{ t('dash.items') }}</small></div>
              <div class="stat-foot">已定 {{ dStock().reserved || 0 }} · 借出 {{ dStock().loaned || 0 }}</div>
            </div>
            <div class="stat">
              <div class="stat-label">🏦 {{ t('dash.stockCost') }}</div>
              <div class="stat-value serif">{{ money(dStock().cost) }}</div>
              <div class="stat-foot">零售 {{ money(dStock().price) }}</div>
            </div>
            <div class="stat">
              <div class="stat-label">🧾 {{ t('dash.todaySales') }}</div>
              <div class="stat-value serif">{{ money(dToday().amount) }}</div>
              <div class="stat-foot">{{ dToday().count || 0 }} {{ t('dash.bills') }}</div>
            </div>
            <div class="stat">
              <div class="stat-label">⏳ {{ t('dash.receivable') }}</div>
              <div class="stat-value serif">{{ money(dDue().amount) }}</div>
              <div class="stat-foot">{{ t('date.month') }} {{ money(dMonth().amount) }}</div>
            </div>
          </div>

          <div class="stats-grid" v-if="ST.dash && ST.dash.rangeData">
            <div class="stat" v-if="ST.riskData && ST.riskData.aging && ST.riskData.aging.count > 0">
              <div class="stat-label">⏳ {{ t('dash.aging') }}</div>
              <div class="stat-value">{{ ST.riskData.aging.count }}<small>{{ t('dash.pieceUnit') }}</small></div>
              <div class="stat-foot">{{ ST.riskData.aging.cost == null ? '***' : '￥' + fmtNum(ST.riskData.aging.cost) }}</div>
            </div>
            <div class="stat">
              <div class="stat-label">{{ t('dash.rangeSales') }}</div>
              <div class="stat-value serif">￥{{ fmtNum(ST.dash.rangeData.sales.amount) }}</div>
              <div class="stat-foot">{{ ST.dash.rangeData.sales.count }} {{ t('dash.bills') }} · {{ t('dash.avg') }} ￥{{ fmtNum(ST.dash.rangeData.sales.avg) }}<span v-if="ST.dash.rangeData.sales.momPct != null" :class="pctCls(ST.dash.rangeData.sales.momPct)"> · {{ t('dash.mom') }} {{ pctLabel(ST.dash.rangeData.sales.momPct) }}</span><span v-if="ST.dash.rangeData.sales.yoyPct != null" :class="pctCls(ST.dash.rangeData.sales.yoyPct)"> · {{ t('dash.yoy') }} {{ pctLabel(ST.dash.rangeData.sales.yoyPct) }}</span></div>
            </div>
            <div class="stat">
              <div class="stat-label">{{ t('dash.rangeMove') }}</div>
              <div class="stat-value"><span class="mv-in">+{{ ST.dash.rangeData.stockIn.qty }}</span><span class="mv-sep">/</span><span class="mv-out">-{{ ST.dash.rangeData.stockOut.qty }}</span></div>
              <div class="stat-foot">{{ t('dash.onhand') }} {{ ST.dash.stock.count }} · {{ t('dash.cost') }} {{ ST.dash.stock.cost == null ? '***' : '￥' + fmtNum(ST.dash.stock.cost) }}</div>
            </div>
            <div class="stat">
              <div class="stat-label">{{ t('dash.rangeDue') }}</div>
              <div class="stat-value serif">￥{{ fmtNum(ST.dash.rangeData.depositPending.amount) }}</div>
              <div class="stat-foot">{{ ST.dash.rangeData.depositPending.count }} {{ t('dash.depBills') }}</div>
            </div>
            <div class="stat">
              <div class="stat-label">{{ t('dash.rangeCustDue') }}</div>
              <div class="stat-value serif">￥{{ fmtNum(ST.dash.rangeData.customerDue.amount) }}</div>
            </div>
          </div>
          <div class="risk-bar" v-if="ST.riskData && ST.riskData.lastStocktake && (ST.riskData.lastStocktake.surplus_count > 0 || ST.riskData.lastStocktake.shortage_count > 0)">
            <div class="risk-card">
              <span class="rc-icon">📡</span>
              <span class="rc-text">{{ t('dash.stocktakeRisk') }} {{ ST.riskData.lastStocktake.created.slice(5,10) }}</span>
              <span class="rc-val"><span class="mv-in">{{ t('inv.surplus') }} {{ ST.riskData.lastStocktake.surplus_count }}</span> <span class="mv-out">{{ t('inv.shortage') }} {{ ST.riskData.lastStocktake.shortage_count }}</span></span>
            </div>
          </div>

          <div class="card">
            <div class="card-accent"></div>
            <div class="card-head"><div class="card-title">{{ t('dash.quick') }}</div></div>
            <div class="quick-grid">
              <div class="quick-item" @click="openSub('sale-new')"><div class="quick-ico">🧾</div><div class="quick-label">{{ t('q.sale') }}</div></div>
              <div class="quick-item" @click="openSub('dep-new')"><div class="quick-ico">💰</div><div class="quick-label">{{ t('q.deposit') }}</div></div>
              <div class="quick-item" @click="inboundForm()"><div class="quick-ico">📥</div><div class="quick-label">{{ t('q.inbound') }}</div></div>
              <div class="quick-item" @click="openSub('inventory')"><div class="quick-ico">📦</div><div class="quick-label">{{ t('inv.title') }}</div></div>
            </div>
          </div>

          <div class="card">
            <div class="card-accent"></div>
            <div class="card-head">
              <div class="card-title">{{ t('dash.reminders') }}</div>
              <span class="card-more">{{ reminderCount() }}</span>
            </div>
            <div v-if="reminderCount() === 0" class="empty" style="padding:26px 10px">
              <div class="empty-ico">✅</div>
              <div class="empty-text">{{ t('dash.noReminder') }}</div>
            </div>
            <div v-else>
              <div class="remind" v-if="remDeposits().length" @click="openSub('deposits')">
                <div class="remind-ico due">💰</div>
                <div class="remind-body"><div class="remind-title">{{ t('dash.dueDeposit') }}</div><div class="remind-sub">{{ t('dep.title') }}</div></div>
                <div class="remind-count">{{ remDeposits().length }}</div>
              </div>
              <div class="remind" v-if="remLoans().length" @click="openSub('loans')">
                <div class="remind-ico blue">🔁</div>
                <div class="remind-body"><div class="remind-title">{{ t('dash.loansOverdue') }}</div><div class="remind-sub">{{ t('loan.title') }}</div></div>
                <div class="remind-count">{{ remLoans().length }}</div>
              </div>
              <div class="remind" v-if="remRepairs().length" @click="openSub('repairs')">
                <div class="remind-ico purple">🛠</div>
                <div class="remind-body"><div class="remind-title">{{ t('dash.repairs') }}</div><div class="remind-sub">{{ t('rep.title') }}</div></div>
                <div class="remind-count">{{ remRepairs().length }}</div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-accent"></div>
            <div class="card-head">
              <div class="card-title">{{ t('dash.trend') }}</div>
              <div class="cmp-chips">
                <span class="cmp-chip" :class="{on: ST.trendCmp==='yoy'}" @click="setTrendCmp('yoy')">{{ t('dash.yoy') }}</span>
                <span class="cmp-chip" :class="{on: ST.trendCmp==='mom'}" @click="setTrendCmp('mom')">{{ t('dash.mom') }}</span>
              </div>
            </div>
            <div class="trend-range-row">
              <select class="trend-range" :value="ST.dashRange" @change="setDashRange($event.target.value)">
                <option value="today">{{ t('dash.today') }}</option>
                <option value="week">{{ t('dash.week') }}</option>
                <option value="month">{{ t('dash.month') }}</option>
                <option value="3m">{{ t('rg.3m') }}</option>
                <option value="6m">{{ t('rg.6m') }}</option>
                <option value="year">{{ t('rg.year') }}</option>
              </select>
              <span class="trend-unit">{{ t('dash.trendUnit') }}</span>
            </div>
            <div class="mini-chart">
              <div class="mini-bar-group trend-yaxis" v-if="dTrendLabels().length">
                <div class="mini-bar-pair trend-yaxis-plot">
                  <span v-for="(ya, yi) in dTrendYAxis()" :key="'y'+yi" :style="{top: ya.top}">{{ ya.text }}</span>
                </div>
                <div class="mini-bar-label"></div>
              </div>
              <div class="mini-bar-group" v-for="(lb, i) in dTrendLabels()" :key="'b'+i">
                <div class="mini-bar-pair">
                  <div class="mini-bar cur" :style="{height: barH(i)}"></div>
                  <div class="mini-bar cmp" :style="{height: cmpBarH(i)}"></div>
                </div>
                <div class="mini-bar-label">{{ lb }}</div>
              </div>
            </div>
            <div class="trend-legend">
              <span class="lg-dot cur"></span>{{ t('dash.trendCur') }}
              <span class="lg-dot cmp"></span>{{ t(trendCmpKey()) }}
            </div>
          </div>

          <div class="card" v-if="ST.tagStats">
            <div class="card-accent"></div>
            <div class="card-head">
              <div class="card-title">{{ t('tag.salesStatsTitle') }}</div>
              <div class="cmp-chips">
                <span class="cmp-chip" :class="{on: ST.saleStatsDim === 'category'}" @click="setSaleStatsDim('category')">{{ t('tag.dimCategory') }}</span>
                <span class="cmp-chip" :class="{on: ST.saleStatsDim === 'tag'}" @click="setSaleStatsDim('tag')">{{ t('tag.dimTag') }}</span>
              </div>
            </div>
            <div class="tag-pick-wrap" v-if="ST.saleStatsDim === 'tag' && ST.tagList.length">
              <div class="tag-pick-row">
                <span class="pick-chip" :class="{on: !ST.tagSel.length}" @click="clearTagSel()">{{ t('common.all') }}</span>
              </div>
              <div class="tag-group" v-for="tg in tagGrouped()" :key="'tsg' + tg.group">
                <div class="tag-group-name">{{ tagGroupName(tg.group) }}</div>
                <div class="tag-pick-row">
                  <span class="pick-chip" v-for="o in tg.tags" :key="'ts' + o.id" :class="{on: ST.tagSel.indexOf(o.id) >= 0}" @click="toggleTagSel(o.id)">{{ o.name }}</span>
                </div>
              </div>
            </div>
            <div class="tag-stats-list">
              <div class="tag-stats-row" v-for="(g, i) in ST.tagStats.items" :key="ST.saleStatsDim + '-' + (g.tag_id || g.name)">
                <div class="tag-stats-line">
                  <span class="tag-stats-name"><span class="dl-dot" :style="{background: g.color || donutColor(i % 6)}"></span>{{ g.name }}</span>
                  <div class="tag-stats-bar-wrap"><div class="tag-stats-bar" :style="tagBarStyle(g, i)"></div></div>
                </div>
                <div class="tag-stats-val" v-if="ST.saleStatsDim === 'category'">{{ t('tag.salesAmt') }} ￥{{ fmtNum(g.sale_amount) }} · {{ g.sale_count }} {{ t('tag.pieceUnit') }} · {{ g.sale_pct }}% · {{ t('tag.inStock') }} {{ g.stock_count || 0 }} {{ t('tag.pieceUnit') }}</div>
                <div class="tag-stats-val" v-else>{{ t('tag.salesAmt') }} ￥{{ fmtNum(g.sale_amount) }} · {{ g.sale_count }} {{ t('tag.pieceUnit') }} · {{ g.sale_pct }}% · {{ t('tag.inStock') }} {{ g.stock_count }} {{ t('tag.pieceUnit') }}<span v-if="g.stock_cost != null"> · {{ t('kpi.stockCost') }} ￥{{ fmtNum(g.stock_cost) }}</span></div>
              </div>
            </div>
            <div class="tag-stats-empty" v-if="!ST.tagStats.items || !ST.tagStats.items.length">{{ t('rank.empty') }}</div>
            <div class="tag-stats-note" v-if="ST.saleStatsDim === 'tag' && ST.tagStats.note">{{ t('tag.dupNote') }}</div>
          </div>

          <div class="card" v-if="ST.catSales">
            <div class="card-accent"></div>
            <div class="card-head"><div class="card-title">{{ t('kpi.catSales') }}</div></div>
            <div class="donut-wrap" v-if="ST.catSales.items && ST.catSales.items.length">
              <svg class="donut-svg" viewBox="0 0 42 42">
                <circle cx="21" cy="21" r="15.9" fill="none" stroke="#eee" stroke-width="6"></circle>
                <circle v-for="s in catDonutSegments()" :key="s.key" cx="21" cy="21" r="15.9" fill="none"
                        :stroke="donutColor(s.color)" stroke-width="6" pathLength="100"
                        :stroke-dasharray="s.pct + ' ' + (100 - s.pct)" :stroke-dashoffset="s.offset"
                        transform="rotate(-90 21 21)"></circle>
                <text x="21" y="20" class="donut-c1">{{ t('dash.donutTotal') }}</text>
                <text x="21" y="24.5" class="donut-c2">￥{{ fmtNum(ST.catSales.total) }}</text>
              </svg>
              <div class="donut-legend">
                <div class="dl-row" v-for="(c, i) in ST.catSales.items" :key="c.category">
                  <span class="dl-dot" :style="{background: donutColor(i % 6)}"></span>
                  <span class="dl-name">{{ catText(c.category) }}</span>
                  <span class="dl-val">￥{{ fmtNum(c.amount) }} · {{ c.pct }}% · {{ t('tag.inStock') }} {{ c.stock_count || 0 }} {{ t('tag.pieceUnit') }}</span>
                </div>
              </div>
            </div>
            <div class="empty" style="padding:22px 10px" v-if="!ST.catSales.items || !ST.catSales.items.length"><div class="empty-text">{{ t('rank.empty') }}</div></div>
          </div>

          <div class="card" v-if="ST.rankData">
            <div class="card-accent"></div>
            <div class="card-head"><div class="card-title">{{ t('rank.title') }}</div></div>
            <div class="rank-hint">{{ t('rank.periodHint') }}</div>
            <div class="rank-grid">
              <div class="rank-box" v-for="bk in rankBlocks()" :key="bk.key">
                <div class="rank-box-title">{{ bk.title }}<span class="rank-box-hint" v-if="bk.hint">（{{ bk.hint }}）</span></div>
                <div class="rank-row" v-for="(r, i) in bk.rows" :key="bk.key + '-' + i">
                  <span class="rank-no" :class="'rank-no-' + (i + 1)">{{ i + 1 }}</span>
                  <span class="rank-name">{{ r.name }}</span>
                  <span class="rank-val"><b>{{ r.v }}</b><em v-if="r.sub">{{ r.sub }}</em></span>
                </div>
                <div class="rank-empty" v-if="!bk.rows.length">{{ t('rank.empty') }}</div>
              </div>
            </div>
          </div>

          <div class="card" v-if="ST.bizAnalysis">
            <div class="card-accent"></div>
            <div class="card-head"><div class="card-title">{{ t('ba.title') }}</div></div>
            <div class="ba-group">
              <div class="ba-group-title">💹 {{ t('ba.profitGrp') }}</div>
              <div class="ba-cards">
                <div class="ba-card"><div class="ba-val">￥{{ ST.bizAnalysis.profit.cost == null ? '***' : fmtNum(ST.bizAnalysis.profit.cost) }}</div><div class="ba-label">{{ t('ba.realCost') }}</div></div>
                <div class="ba-card"><div class="ba-val">￥{{ ST.bizAnalysis.profit.profit == null ? '***' : fmtNum(ST.bizAnalysis.profit.profit) }}</div><div class="ba-label">{{ t('ba.profit') }}</div></div>
                <div class="ba-card"><div class="ba-val">{{ ST.bizAnalysis.profit.rate == null ? '***' : ST.bizAnalysis.profit.rate + '%' }}</div><div class="ba-label">{{ t('ba.profitRate') }}</div></div>
              </div>
            </div>
            <div class="ba-group">
              <div class="ba-group-title">👥 {{ t('ba.member') }}</div>
              <div class="ba-cards">
                <div class="ba-card"><div class="ba-val">{{ ST.bizAnalysis.member.newMembers }}</div><div class="ba-label">{{ t('ba.newMembers') }}</div></div>
                <div class="ba-card"><div class="ba-val">￥{{ fmtNum(ST.bizAnalysis.member.recharge) }}</div><div class="ba-label">{{ t('ba.recharge') }}</div></div>
                <div class="ba-card"><div class="ba-val">￥{{ fmtNum(ST.bizAnalysis.member.memberPay) }}</div><div class="ba-label">{{ t('ba.memberPay') }}</div></div>
              </div>
            </div>
            <div class="ba-group">
              <div class="ba-group-title">🧾 {{ t('ba.salesEff') }}</div>
              <div class="ba-cards">
                <div class="ba-card"><div class="ba-val">￥{{ fmtNum(ST.bizAnalysis.sales.avgPerBill) }}</div><div class="ba-label">{{ t('ba.avgPerBill') }}</div></div>
                <div class="ba-card"><div class="ba-val">{{ ST.bizAnalysis.sales.attachment }}</div><div class="ba-label">{{ t('ba.attachment') }}</div></div>
                <div class="ba-card"><div class="ba-val">￥{{ fmtNum(ST.bizAnalysis.sales.avgPerItem) }}</div><div class="ba-label">{{ t('ba.avgPerItem') }}</div></div>
                <div class="ba-card"><div class="ba-val">{{ ST.bizAnalysis.sales.sellThrough }}%</div><div class="ba-label">{{ t('ba.sellThrough') }}</div></div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-accent"></div>
            <div class="card-head">
              <div class="card-title">{{ t('dash.recent') }}</div>
              <span class="card-more" @click="openSub('sales')">{{ t('dash.viewAll') }}</span>
            </div>
            <div v-if="!dRecent().length" class="empty" style="padding:22px 10px"><div class="empty-text">{{ t('common.empty') }}</div></div>
            <div class="list-card" v-else style="margin:0;border:none;box-shadow:none">
              <div class="list-item" v-for="s in dRecent()" :key="s.bill_no">
                <div class="list-item-ico">🧾</div>
                <div class="list-item-body">
                  <div class="list-item-title"><span class="name">{{ s.customer || '—' }}</span></div>
                  <div class="list-item-sub">{{ s.bill_no }} · {{ s.biz_date }}</div>
                </div>
                <div class="list-item-tail"><div class="list-item-amount">{{ money(s.amount) }}</div></div>
              </div>
            </div>
          </div>
        </template>

        <!-- ========== 商品 ========== -->
        <template v-else-if="ST.sub === '' && ST.tab === 'products'">
          <div class="back-head" style="margin-bottom:10px">
            <div class="back-title">{{ t('prod.title') }}</div>
            <button class="btn btn-gold btn-sm" @click="newProduct()">＋ {{ t('prod.new') }}</button>
          </div>
          <div class="search-bar">
            <input v-model="ST.products.q" :placeholder="t('prod.searchPh')" @keyup.enter="loadProducts(true)">
          </div>
          <div class="chips">
            <div class="chip" :class="{active: ST.products.status === ''}" @click="ST.products.status=''; loadProducts(true)">{{ t('common.all') }}</div>
            <div class="chip" :class="{active: ST.products.status === '在库'}" @click="ST.products.status='在库'; loadProducts(true)">{{ t('st.inStock') }}</div>
            <div class="chip" :class="{active: ST.products.status === '已定'}" @click="ST.products.status='已定'; loadProducts(true)">{{ t('st.reserved') }}</div>

<script src="./i18n.js?v=20261018b10"></script>
<script>
(function () {
  if (!window.__APP_BASE__) {
    var p = location.pathname;
    var i = p.indexOf("/mobile");
    if (i >= 0) p = p.slice(0, i) + "/";
    else p = p.replace(/[^/]*$/, "");
    window.__APP_BASE__ = p.replace(/\/+$/, "");
  }
})();
</script>
<script src="./app.js?v=20261018b10"></script>
<script>
// 依据可视高度动态设定容器高度：解决手机浏览器底部工具栏遮挡 tab 栏的问题
(function () {
  function setAppHeight() {
    document.documentElement.style.setProperty("--app-h", window.innerHeight + "px");
  }
  setAppHeight();
  window.addEventListener("resize", setAppHeight);
  window.addEventListener("orientationchange", function () { setTimeout(setAppHeight, 250); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", setAppHeight);
  }
})();
// 清理历史 Service Worker（曾导致静态资源缓存错配、脚本失效白屏），并做挂载失败兜底
(function () {
  if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      for (var i = 0; i < rs.length; i++) { rs[i].unregister(); }
    }).catch(function () {});
  }
  setTimeout(function () {
    var el = document.querySelector(".phone");
    if (el && el.hasAttribute("v-cloak")) {
      el.removeAttribute("v-cloak");
      el.innerHTML = '<div style="padding:48px 24px;text-align:center;color:#5C2233;font-size:15px;line-height:1.8">页面加载失败，请下拉刷新重试</div>';
    }
  }, 5000);
})();
</script>
