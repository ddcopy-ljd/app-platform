<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运维端 · 懿臻珠宝云</title>
<link rel="stylesheet" href="/ops/app.css">
</head>
<body>
<div id="app">

  <!-- 未授权遮罩 -->
  <div id="blocked" class="blocked" style="display:none">
    <div class="blocked-box">
      <div class="blocked-icon">⛔</div>
      <h2>无权访问运维端</h2>
      <p id="blocked-reason">运维端仅允许平台「生产运维穿透」模式进入。</p>
      <p class="muted">普通业务登录与沙箱模式均被禁止。请从平台「应用插件管理 → 网关调试」以 PRODUCTION_SUPPORT 模式进入。</p>
    </div>
  </div>

  <!-- 正常界面 -->
  <div id="console" style="display:none">
    <header class="danger-bar">
      <div class="danger-title">
        <span class="warn-icon">⚠</span>
        <div>
          <div class="t1">运维端 · 生产运维穿透</div>
          <div class="t2">真实租户库 · 只读巡检 · 一切操作留痕</div>
        </div>
      </div>
      <div class="danger-chips" id="ctx-chips"></div>
    </header>

    <main class="content">
      <section class="section">
        <h3>经营总览</h3>
        <div class="cards" id="cards"><div class="loading">加载中…</div></div>
      </section>

      <section class="section">
        <h3>扫描助手设备 <span class="sub" id="dev-summary"></span></h3>
        <div class="table-wrap">
          <table class="dev-table">
            <thead>
              <tr>
                <th>状态</th><th>设备码</th><th>名称</th><th>门店</th>
                <th>APK 版本</th><th>安装包指纹</th><th>最后上报</th><th>任务</th>
              </tr>
            </thead>
            <tbody id="dev-rows"><tr><td colspan="8" class="loading">加载中…</td></tr></tbody>
          </table>
        </div>
      </section>

      <footer class="foot">
        运维端为独立只读站点；受控写操作（终止任务/解冻/账号重置）将在后续版本开放并逐笔审计。
      </footer>
    </main>
  </div>

</div>
<script src="/ops/app.js"></script>
</body>
</html>
