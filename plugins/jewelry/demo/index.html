<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>懿臻珠宝云 · 界面演示</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --gold:#C7A252;--gold-2:#E8D9B0;--wine:#7A1E2B;--wine-2:#8C2A3D;
    --bg:#F5EFE3;--cream:#FBF7EE;--text:#3A2E26;--text-2:#6E5F52;
  }
  body{
    font-family:"PingFang SC","Microsoft YaHei","Songti SC",serif;
    background:radial-gradient(circle at 50% 0%,#FFF8E9,var(--bg) 60%);
    min-height:100vh;color:var(--text);
    display:flex;align-items:center;justify-content:center;padding:32px 20px;
  }
  .card{
    background:linear-gradient(160deg,#FFFDF7,#FAEED6);
    border:1px solid var(--gold-2);border-radius:26px;max-width:640px;width:100%;
    padding:52px 46px;text-align:center;box-shadow:0 30px 80px rgba(122,30,43,.16);
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:6px;
    background:linear-gradient(90deg,var(--gold),var(--wine),var(--gold));opacity:.7;
  }
  .brand{font-family:"Songti SC",serif;font-size:15px;letter-spacing:6px;color:var(--text-2);margin-bottom:6px}
  .logo{
    width:88px;height:88px;margin:0 auto 22px;border-radius:50%;line-height:88px;font-size:42px;
    color:#fff;font-family:"Songti SC",serif;
    background:linear-gradient(135deg,var(--gold),var(--wine));
    box-shadow:0 12px 30px rgba(122,30,43,.35);
  }
  h1{font-size:34px;color:var(--wine);margin-bottom:10px}
  .sub{color:var(--text-2);font-size:15px;margin-bottom:44px}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .opt{
    display:block;text-decoration:none;color:inherit;border-radius:20px;padding:30px 18px 26px;
    border:1px solid var(--gold-2);background:var(--cream);transition:.25s;
  }
  .opt:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(122,30,43,.14);border-color:var(--gold)}
  .opt .ico{font-size:46px;margin-bottom:14px}
  .opt h2{font-size:20px;color:var(--wine);margin-bottom:6px}
  .opt p{font-size:13px;color:var(--text-2)}
  .tail{margin-top:36px;font-size:12.5px;color:var(--text-2)}
  .tail a{color:var(--wine);text-decoration:none;border-bottom:1px dashed var(--gold)}
  @media (max-width:520px){
    .card{padding:38px 24px}
    .options{grid-template-columns:1fr}
    h1{font-size:28px}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">懿臻珠宝云&ensp;·&ensp;YI JEWELRY</div>
    <div class="logo">懿</div>
    <h1>选择演示终端</h1>
    <p class="sub">面向不同屏幕尺寸与方向的界面原型，请选择入口</p>

    <div class="options">
      <a class="opt" href="懿臻珠宝云-电脑端界面原型.html">
        <div class="ico">🖥️</div>
        <h2>电脑版</h2>
        <p>宽屏桌面 · 横向布局<br>门店经营看板与完整管理</p>
      </a>
      <a class="opt" href="懿臻珠宝云-手机端界面原型.html">
        <div class="ico">📱</div>
        <h2>手机版</h2>
        <p>窄屏移动 · 竖版布局<br>便携开单与即时盘点</p>
      </a>
    </div>

    <div class="tail">界面原型，仅用于功能演示 · <a href="https://example.com/业务需求.md" onclick="return false">查看业务需求</a></div>
  </div>
</body>
</html>
