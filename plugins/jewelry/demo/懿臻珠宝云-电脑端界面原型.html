<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>懿珠宝管家 · 演示</title>
<style>
  :root{
    --gold:#C9A961;
    --gold-light:#E8D5A0;
    --gold-pale:#F5EBD8;
    --gold-dark:#9C7B3A;
    --wine:#5C2233;
    --wine-light:#7A2E42;
    --wine-deep:#421824;
    --cream:#FBF6EC;
    --card:#FFFFFF;
    --text:#3D2B1F;
    --text-2:#7A6A55;
    --border:#EADFC8;
    --red:#A8362F;
    --green:#5B7A3A;
    --blue:#3A5A7A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    background:var(--cream);color:var(--text);font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);}
  table{width:100%;border-collapse:collapse;}
  .serif{font-family:"Songti SC","STSong","SimSun",serif;}

  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:248px;flex-shrink:0;
    background:linear-gradient(180deg,var(--wine) 0%,var(--wine-deep) 100%);
    color:#F5E9DA;display:flex;flex-direction:column;position:relative;
  }
  .sidebar::after{
    content:"";position:absolute;right:0;top:0;bottom:0;width:1px;
    background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:.5;
  }
  .brand{
    height:78px;display:flex;align-items:center;gap:12px;padding:0 22px;
    border-bottom:1px solid rgba(201,169,97,.25);
  }
  .brand-mark{
    width:40px;height:40px;border-radius:50%;
    background:linear-gradient(135deg,#E8D5A0,#C9A961 45%,#9C7B3A);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;color:#5C2233;font-weight:700;flex-shrink:0;
    box-shadow:0 3px 10px rgba(201,169,97,.4),inset 0 1px 2px rgba(255,255,255,.6);
  }
  .brand-text{line-height:1.25;}
  .brand-name{font-size:16px;font-weight:600;letter-spacing:1px;color:#F7EFE0;}
  .brand-sub{font-size:10px;letter-spacing:2px;color:var(--gold);opacity:.85;margin-top:2px;}

  .store-switch{
    margin:14px 16px 10px;padding:12px 14px;border-radius:8px;
    background:linear-gradient(135deg,rgba(201,169,97,.18),rgba(201,169,97,.08));
    border:1px solid rgba(201,169,97,.35);
    display:flex;align-items:center;gap:10px;cursor:pointer;
    transition:all .18s;position:relative;
  }
  .store-switch:hover{background:rgba(201,169,97,.22);}
  .store-ico{font-size:16px;}
  .store-info{flex:1;min-width:0;}
  .store-name{font-size:13px;font-weight:600;color:#F7EFE0;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .store-arrow{font-size:10px;color:rgba(201,169,97,.7);}

  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 22px;font-size:14px;color:rgba(245,233,218,.72);
    cursor:pointer;position:relative;transition:all .2s;
    border-left:3px solid transparent;
  }
  .nav-item:hover{color:#F7EFE0;background:rgba(201,169,97,.08);}
  .nav-item.active{
    color:#F7EFE0;
    background:linear-gradient(90deg,rgba(201,169,97,.22),transparent);
    border-left-color:var(--gold);
  }
  .nav-item.active::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    box-shadow:0 0 12px rgba(201,169,97,.8);
  }
  .nav-ico{font-size:15px;width:20px;text-align:center;}
  .nav-badge{
    margin-left:auto;background:var(--gold);color:var(--wine-deep);
    font-size:10px;padding:1px 7px;border-radius:8px;font-weight:600;
  }
  .sidebar-foot{
    margin-top:auto;padding:16px 22px;
    border-top:1px solid rgba(201,169,97,.25);
    display:flex;align-items:center;gap:12px;
  }
  .avatar{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,#E8D5A0,#C9A961);
    display:flex;align-items:center;justify-content:center;
    color:#5C2233;font-weight:600;font-size:14px;
  }
  .foot-info{font-size:13px;line-height:1.35;color:#F5E9DA;flex:1;min-width:0;}
  .foot-info small{display:block;font-size:10px;color:rgba(201,169,97,.7);letter-spacing:.5px;margin-top:2px;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    min-height:78px;display:flex;align-items:center;justify-content:space-between;
    padding:0 32px;background:var(--card);
    border-bottom:1px solid var(--border);position:relative;gap:20px;
  }
  .topbar::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6;
  }
  .crumb{font-size:13px;color:var(--text-2);letter-spacing:.5px;display:flex;align-items:center;gap:12px;}
  .crumb b{color:var(--text);font-weight:600;font-size:15px;letter-spacing:.5px;}
  .store-pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 12px;border-radius:14px;font-size:12px;
    background:linear-gradient(135deg,#F7EFE0,#EFE2C6);
    border:1px solid #E5D3A8;color:var(--gold-dark);letter-spacing:.5px;
  }
  .top-actions{display:flex;align-items:center;gap:14px;}
  .top-date{font-size:12px;color:var(--text-2);letter-spacing:.5px;padding-right:12px;border-right:1px solid var(--border);}
  .content{flex:1;padding:26px 32px 40px;overflow:auto;}

  .rules{
    background:linear-gradient(135deg,#FFFDF7,#FBF4E2);
    border:1px solid #E5D3A8;border-radius:10px;
    padding:0;margin-bottom:18px;overflow:hidden;
    box-shadow:0 1px 2px rgba(92,34,51,.03);
  }
  .rules-head{
    padding:13px 18px;display:flex;align-items:center;gap:10px;
    cursor:pointer;user-select:none;
    border-bottom:1px solid transparent;transition:all .18s;
  }
  .rules.open .rules-head{border-bottom-color:#E5D3A8;}
  .rules-head:hover{background:rgba(201,169,97,.08);}
  .rules-ico{
    width:22px;height:22px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold-light),var(--gold-dark));
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:12px;flex-shrink:0;font-weight:700;
  }
  .rules-title{font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--gold-dark);}
  .rules-count{
    font-size:11px;color:var(--text-2);background:#F5EBD8;
    padding:1px 8px;border-radius:8px;letter-spacing:.5px;
  }
  .rules-toggle{
    margin-left:auto;font-size:12px;font-weight:600;color:var(--gold-dark);
    display:flex;align-items:center;gap:5px;
  }
  .rules-body{padding:0 18px;max-height:0;overflow:hidden;transition:max-height .3s,padding .3s;}
  .rules.open .rules-body{max-height:800px;padding:14px 18px 16px;}
  .rule-item{
    display:flex;gap:10px;padding:7px 0;font-size:12.5px;
    color:var(--text);line-height:1.75;border-bottom:1px dashed #EFE2C6;
  }
  .rule-item:last-child{border-bottom:none;}
  .rule-idx{
    flex-shrink:0;width:18px;height:18px;border-radius:4px;
    background:#F5EBD8;color:var(--gold-dark);
    font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;
    margin-top:2px;
  }
  .rule-item b{color:var(--wine);font-weight:600;}

  .card{
    background:var(--card);border-radius:10px;padding:24px;
    border:1px solid var(--border);
    box-shadow:0 1px 2px rgba(92,34,51,.04),0 8px 24px -12px rgba(92,34,51,.08);
  }
  .card+.card{margin-top:18px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .card-title{font-size:16px;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:10px;}
  .card-title::before{
    content:"";width:3px;height:16px;border-radius:2px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold-dark));
  }
  .card-title small{font-weight:400;font-size:12px;color:var(--text-2);letter-spacing:.3px;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 18px;border-radius:6px;font-size:13px;letter-spacing:.5px;transition:all .18s;
  }
  .btn-gold{
    background:linear-gradient(135deg,#E0C87F,#C9A961 50%,#B08D45);
    color:#fff;box-shadow:0 2px 8px rgba(201,169,97,.35);
    text-shadow:0 1px 1px rgba(140,100,20,.3);
  }
  .btn-gold:hover{box-shadow:0 4px 14px rgba(201,169,97,.55);transform:translateY(-1px);}
  .btn-wine{background:var(--wine);color:#F5E9DA;}
  .btn-wine:hover{background:var(--wine-light);}
  .btn-ghost{background:var(--gold-pale);color:var(--gold-dark);border:1px solid var(--border);}
  .btn-ghost:hover{background:#EFE2C6;}
  .btn-sm{padding:5px 12px;font-size:12px;}

  .tag{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;letter-spacing:.5px;}
  .tag-gold{background:linear-gradient(135deg,#F7EFE0,#EFE2C6);color:var(--gold-dark);border:1px solid #E5D3A8;}
  .tag-gray{background:#F2EDE2;color:var(--text-2);}

  .link{color:var(--gold-dark);cursor:pointer;font-size:13px;}
  .link:hover{text-decoration:underline;color:var(--gold);}

  .state{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 10px;border-radius:10px;font-size:11px;letter-spacing:.5px;
  }
  .state::before{
    content:"";width:6px;height:6px;border-radius:50%;background:currentColor;
    opacity:.9;
  }
  .state-ok{background:#EEF3E6;color:var(--green);}
  .state-lock{background:linear-gradient(135deg,#F7EFE0,#EFE2C6);color:var(--gold-dark);border:1px solid #E5D3A8;}
  .state-loan{background:#F3E4E8;color:var(--wine);}
  .state-due{background:#F7E8E5;color:var(--red);}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:20px;}
  .stat{
    background:var(--card);border-radius:10px;padding:22px;
    border:1px solid var(--border);position:relative;overflow:hidden;
    box-shadow:0 1px 2px rgba(92,34,51,.04),0 8px 24px -12px rgba(92,34,51,.08);
  }
  .stat::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--gold-light),var(--gold),var(--gold-dark));
  }
  .stat-label{font-size:12px;color:var(--text-2);letter-spacing:.5px;margin-bottom:12px;}
  .stat-value{font-size:30px;font-weight:700;letter-spacing:1px;font-family:"Songti SC",serif;color:var(--wine);}
  .stat-value small{font-size:14px;font-weight:400;color:var(--text-2);margin-left:2px;}
  .stat-foot{font-size:11px;margin-top:10px;color:var(--text-2);letter-spacing:.5px;}
  .up{color:var(--green);}
  .warn{color:#B8802A;}

  table thead th{
    text-align:left;padding:12px 14px;font-size:12px;font-weight:600;
    color:var(--text-2);letter-spacing:.5px;
    background:linear-gradient(180deg,#FDFAF3,#F9F3E6);
    border-bottom:1px solid var(--border);
  }
  table tbody td{padding:14px;font-size:13px;border-bottom:1px solid #F4EEE0;letter-spacing:.3px;}
  table tbody tr:hover{background:#FDFAF3;}
  table tbody tr:last-child td{border-bottom:none;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .prod{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:18px;position:relative;transition:all .2s;
  }
  .prod:hover{border-color:var(--gold);box-shadow:0 6px 20px -8px rgba(201,169,97,.5);transform:translateY(-2px);}
  .prod-ico{
    width:44px;height:44px;border-radius:8px;
    background:linear-gradient(135deg,#FBF4E2,#F0E2C0);
    display:flex;align-items:center;justify-content:center;font-size:22px;
    margin-bottom:12px;border:1px solid #EAD9B0;
  }
  .prod-name{font-size:14px;font-weight:600;letter-spacing:.5px;margin-bottom:4px;}
  .prod-code{font-size:11px;color:var(--text-2);font-family:monospace;letter-spacing:.5px;}
  .prod-meta{font-size:12px;color:var(--text-2);margin-top:10px;line-height:1.8;}
  .prod-price{font-size:17px;font-weight:700;color:var(--wine);font-family:"Songti SC",serif;margin-top:8px;}
  .prod-badge{position:absolute;top:14px;right:14px;}

  .timeline{position:relative;padding-left:22px;}
  .timeline::before{
    content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;
    background:linear-gradient(180deg,var(--gold),transparent);
  }
  .tl-item{position:relative;padding-bottom:18px;}
  .tl-item::before{
    content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;
    background:var(--card);border:2px solid var(--gold);
  }
  .tl-item.done::before{background:var(--gold);}
  .tl-title{font-size:13px;font-weight:600;}
  .tl-desc{font-size:12px;color:var(--text-2);margin-top:3px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:7px;}
  .field label{font-size:12px;color:var(--text-2);letter-spacing:.5px;}
  .field input,.field select,.field textarea{
    padding:10px 13px;border:1px solid var(--border);border-radius:6px;
    background:#FDFAF3;outline:none;transition:all .18s;font-size:13px;
  }
  .field input:focus,.field select:focus{
    border-color:var(--gold);background:#fff;
    box-shadow:0 0 0 3px rgba(201,169,97,.14);
  }
  .field-full{grid-column:1 / -1;}

  .mask{
    position:fixed;inset:0;background:rgba(66,24,36,.5);
    backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;z-index:1000;padding:24px;
  }
  .mask.show{display:flex;}
  .modal{
    background:var(--card);border-radius:12px;width:100%;max-width:660px;
    max-height:88vh;overflow:auto;
    box-shadow:0 30px 80px -20px rgba(66,24,36,.5);
    animation:pop .22s ease-out;border:1px solid var(--gold-light);
  }
  @keyframes pop{from{opacity:0;transform:translateY(-14px) scale(.98);}}
  .modal-head{
    padding:20px 26px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(180deg,#FDFAF3,#fff);
  }
  .modal-head h3{font-size:16px;font-weight:600;letter-spacing:.5px;}
  .modal-head h3::before{
    content:"";display:inline-block;width:3px;height:15px;margin-right:10px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold-dark));
    border-radius:2px;vertical-align:-2px;
  }
  .modal-x{font-size:18px;color:var(--text-2);width:30px;height:30px;border-radius:50%;}
  .modal-x:hover{background:var(--gold-pale);color:var(--wine);}
  .modal-body{padding:26px;}
  .modal-foot{
    padding:18px 26px;border-top:1px solid var(--border);
    display:flex;justify-content:flex-end;gap:12px;background:#FDFAF3;
  }

  .toast{
    position:fixed;top:26px;left:50%;transform:translateX(-50%);
    padding:13px 26px;border-radius:8px;font-size:13px;letter-spacing:.5px;z-index:2000;
    background:linear-gradient(135deg,var(--wine),var(--wine-deep));
    color:#F7EFE0;border:1px solid var(--gold);
    box-shadow:0 12px 32px -8px rgba(66,24,36,.6);animation:pop .2s;
  }

  .empty{text-align:center;padding:64px 20px;color:var(--text-2);}
  .empty-ico{font-size:44px;margin-bottom:14px;opacity:.6;}

  .deposit{
    background:linear-gradient(135deg,#FFFCF5,#FBF3E2);
    border:1px solid #E5D3A8;border-radius:10px;padding:20px;position:relative;overflow:hidden;
  }
  .deposit::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold-dark));
  }
  .deposit.urgent::before{background:linear-gradient(180deg,#E8A8A0,var(--red));}
  .deposit-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .deposit-cust{font-size:15px;font-weight:600;letter-spacing:.5px;}
  .deposit-prod{font-size:12px;color:var(--text-2);margin-top:3px;}
  .deposit-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0;}
  .dnum{background:rgba(255,255,255,.7);border-radius:6px;padding:10px 12px;border:1px solid #EFE2C6;}
  .dnum-k{font-size:11px;color:var(--text-2);letter-spacing:.5px;}
  .dnum-v{font-size:15px;font-weight:700;color:var(--wine);margin-top:4px;font-family:"Songti SC",serif;}
  .dnum-v.paid{color:var(--green);}
  .dnum-v.due{color:var(--red);}

  .filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .filters input,.filters select{
    padding:9px 14px;border:1px solid var(--border);border-radius:6px;
    background:#FDFAF3;outline:none;font-size:13px;
  }
  .filters input{width:240px;}
  .filters input:focus,.filters select:focus{border-color:var(--gold);background:#fff;}

  .loan-row{display:flex;align-items:center;gap:14px;padding:14px;border-bottom:1px solid #F4EEE0;}
  .loan-row:last-child{border-bottom:none;}
  .loan-dir{
    width:56px;height:56px;border-radius:8px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:11px;flex-shrink:0;letter-spacing:.5px;
  }
  .loan-in{background:#EEF3E6;color:var(--green);}
  .loan-out{background:#F3E4E8;color:var(--wine);}

  .split-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

  @media (max-width:1100px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:1fr;}
    .split-2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="app"></div>

const getStore = id => store.stores.find(s => s.id === id);
const currentStore = () => getStore(store.currentStoreId);

function today(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.ceil((new Date(b) - new Date(a)) / 86400000); }
function nextSaleId(){ return 'XS-' + today().replace(/-/g,'') + '-' + String(store.nextSaleSeq++).padStart(3,'0'); }
function nextDepositId(){ return 'DJ-' + today().replace(/-/g,'') + '-' + String(store.nextDepositSeq++).padStart(3,'0'); }

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

function openModal(title, body, foot){
  const m = $('mask');
  m.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><h3>${title}</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">${body}</div>
      ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
    </div>`;
  m.classList.add('show');
}
function closeModal(){ $('mask').classList.remove('show'); $('mask').innerHTML = ''; }

function rulesBox(key, title, rules){
  const open = rulesOpenState[key] === true;
  return `
    <div class="rules ${open ? 'open' : ''}" data-rules-key="${key}">
      <div class="rules-head" data-act="toggle-rules" data-key="${key}">
        <div class="rules-ico">◈</div>
        <div class="rules-title">${title}</div>
        <div class="rules-count">${rules.length}条</div>
        <div class="rules-toggle">
          业务规则 <span style="font-size:10px;opacity:.8;">${open ? '▲' : '▼'}</span>
        </div>
      </div>
      <div class="rules-body">
        ${rules.map((r, i) => `
          <div class="rule-item">
            <div class="rule-idx">${i+1}</div>
            <div>${r}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
}

const actions = {
  'toggle-rules'(el){
    const key = el.key;
    rulesOpenState[key] = !rulesOpenState[key];
    render();
  },

  'switch-store'(){
    openModal('切换门店', `
      <div style="font-size:13px;color:var(--text-2);margin-bottom:16px;">选择要切换的门店，业务数据将同步切换</div>
      ${store.stores.map(s => `
        <div style="display:flex;align-items:center;gap:12px;padding:14px;border:1px solid ${s.id === store.currentStoreId ? 'var(--gold)' : 'var(--border)'};border-radius:8px;margin-bottom:10px;cursor:pointer;background:${s.id === store.currentStoreId ? '#FBF4E2' : '#fff'};"
             data-act="do-switch-store" data-id="${s.id}">
          <div style="font-size:20px;">🏛</div>
          <div style="flex:1;">
            <div style="font-weight:600;">${s.name}</div>
            <div style="font-size:12px;color:var(--text-2);margin-top:2px;">${s.code} · 负责人 ${s.owner}</div>
          </div>
          ${s.id === store.currentStoreId ? '<span class="tag tag-gold">当前</span>' : ''}
        </div>
      `).join('')}
    `, `<button class="btn btn-ghost" onclick="closeModal()">取消</button>`);
  },
  'do-switch-store'(el){
    store.currentStoreId = Number(el.id);
    closeModal();
    toast('已切换到 ' + currentStore().name);
    render();
  },

  'quick-sale'(){
    const options = store.products.filter(p => p.status === '在库')
      .map(p => `<option value="${p.id}">${p.name} · ${p.code} · ${money(p.price)}</option>`).join('');
    const custOptions = store.customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

    openModal('新建销售单', `
      <div class="form-grid">
        <div class="field"><label>客户</label><select id="sale-cust">${custOptions}</select></div>
        <div class="field"><label>开单日期（可自由选择）</label><input type="date" id="sale-date" value="${today()}"></div>
        <div class="field field-full"><label>选择在库商品</label><select id="sale-prod">${options || '<option>暂无在库商品</option>'}</select></div>
        <div class="field"><label>销售金额</label><input type="number" id="sale-amount" placeholder="0.00"></div>
        <div class="field"><label>实收金额</label><input type="number" id="sale-paid" placeholder="0.00"></div>
        <div class="field"><label>收款方式</label>
          <select id="sale-method"><option>现金</option><option>微信</option><option>银行卡</option><option>其他</option></select>
        </div>
        <div class="field"><label>备注</label><input id="sale-note" placeholder="选填"></div>
      </div>
      <div style="margin-top:16px;padding:12px 14px;background:#FBF4E2;border-radius:6px;border:1px solid #E5D3A8;font-size:12px;color:var(--text-2);line-height:1.8;">
        ◈ 开出后商品明细与售价不可修改，如需调整货品只能冲红重开。<br>
        ◈ 客户信息后续可随时调整；开单立即扣减库存。
      </div>
    `, `
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-gold" data-act="do-sale">确认开单</button>
    `);
  },

  'do-sale'(){
    const prodId = Number($('sale-prod').value);
    const prod = getProduct(prodId);
    if (!prod || prod.status !== '在库'){ toast('请选择有效的在库商品'); return; }
    const cust = store.customers.find(c => c.id === Number($('sale-cust').value));
    const amount = Number($('sale-amount').value) || prod.price;
    const paid = Number($('sale-paid').value) || amount;
    const method = $('sale-method').value;
    const date = $('sale-date').value || today();

    prod.status = '已售出';
    store.products = store.products.filter(p => p.id !== prodId);

    store.sales.unshift({
      id: nextSaleId(), cust: cust.name, prod: prod.name,
      amount, paid, method, date, type:'normal',
      status: paid >= amount ? '已完成' : '欠款',
    });

    if (paid < amount) cust.due += (amount - paid);
    cust.total += amount;

    store.logs.unshift({
      time: new Date().toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-'),
      user: '店长 · 王敏', store: currentStore().name.replace('瑾瑜轩 · ',''),
      act: '销售开单', target: prod.name, result: '成功',
    });

    closeModal();
    toast('开单成功 · ' + prod.name + ' · 库存已扣减');
    render();
  },

  'sale-detail'(el){
    const s = store.sales.find(x => x.id === el.id);
    openModal('销售单详情', `
      <div class="form-grid">
        <div><span style="font-size:12px;color:var(--text-2);">销售单号</span><div style="margin-top:6px;font-weight:600;font-family:monospace;">${s.id}</div></div>

        <div><span style="font-size:12px;color:var(--text-2);">购买商品</span><div style="margin-top:6px;font-weight:600;">${s.prod}</div></div>
        <div><span style="font-size:12px;color:var(--text-2);">销售金额</span><div style="margin-top:6px;font-weight:700;color:var(--wine);">${money(s.amount)}</div></div>
        <div><span style="font-size:12px;color:var(--text-2);">实收金额</span><div style="margin-top:6px;font-weight:700;">${money(s.paid)}</div></div>
        <div><span style="font-size:12px;color:var(--text-2);">收款方式</span><div style="margin-top:6px;font-weight:600;">${s.method}</div></div>
        <div><span style="font-size:12px;color:var(--text-2);">订单状态</span><div style="margin-top:6px;">${s.status === '已完成' ? '<span class="state state-ok">已完成</span>' : s.status === '已冲红' ? '<span class="state state-due">已冲红</span>' : '<span class="state state-due">欠款</span>'}</div></div>
      </div>
      <div style="margin-top:18px;padding:12px;background:#FDFAF3;border-radius:6px;font-size:12px;color:var(--text-2);">
        商品明细与售价不可直接修改。如需调整，请点击左下方“冲红作废”后重新下单。
      </div>
    `, `
      ${s.status !== '已冲红' ? `<button class="btn btn-ghost" style="color:var(--red);border-color:var(--red);margin-right:auto;" data-act="do-red-strike" data-id="${s.id}">冲红作废</button>` : ''}
      <button class="btn btn-ghost" onclick="closeModal()">关闭</button>

    `);

    if (!confirm(`确认冲红销售单 ${s.id}？\n冲红后该单据作废，库存将回退。`)) return;
    s.status = '已冲红';
    store.products.push({
      id: store.nextProductSeq++,
      code: 'ZB-RT-' + Math.floor(Math.random()*9000+1000),
      name: s.prod, cat: '珠宝', material: '原材质', weight: '原克重', size: '—', cert: '—',
      cost: Math.round(s.amount * 0.7), price: s.amount, status: '在库', storeId: store.currentStoreId
    });
    store.logs.unshift({
      time: new Date().toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-'),
      user: '店长 · 王敏', store: currentStore().name.replace('瑾瑜轩 · ',''),

  'do-deposit'(){
    const prodId = Number($('dep-prod').value);
    const customName = $('dep-custom-name').value.trim();
    let prod = null;
    let prodName = '';

    if (prodId){
      prod = getProduct(prodId);
      if (prod.status !== '在库'){ toast('该商品不在库'); return; }
      prodName = prod.name;
    } else {
      if (!customName){ toast('请填写定制或无现货商品名称'); return; }
      prodName = customName + ' (定制/无现货)';
    }

    const cust = store.customers.find(c => c.id === Number($('dep-cust').value));
    const phone = $('dep-phone').value || cust.phone;
    const total = Number($('dep-total').value) || (prod ? prod.price : 0);
    const deposit = Number($('dep-deposit').value) || 0;
    if (deposit <= 0){ toast('请填写已收定金金额'); return; }
    if (deposit >= total){ toast('定金金额应小于整体销售额'); return; }

    if (prod) prod.status = '已定';

    store.deposits.unshift({
      id: nextDepositId(), cust: cust.name, custPhone: phone,
      prodId: prod ? prod.id : null,
      prod: prodName, total, deposit, balance: total - deposit,
      promisedDate: $('dep-promise').value,
      reminderDays: Number($('dep-remind').value) || 7,
      status: '待付尾款', created: today(),
    });

    closeModal();
    toast('定金单已创建 · 库存未扣减');
    state.view = 'deposits';
    render();
  },

  'pay-balance'(el){
    const d = store.deposits.find(x => x.id === el.id);
    if (!d) return;
    openModal('收取尾款', `
      <div style="padding:14px;background:#FBF4E2;border-radius:8px;border:1px solid #E5D3A8;margin-bottom:18px;">
        <div style="font-weight:600;">${d.cust} · ${d.prod}</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;font-size:13px;">
          <div>销售总额：<b>${money(d.total)}</b></div>
          <div>已收定金：<b style="color:var(--green)">${money(d.deposit)}</b></div>
          <div>待付尾款：<b style="color:var(--red)">${money(d.balance)}</b></div>
        </div>
      </div>
      <div class="form-grid">
        <div class="field"><label>本次实收金额</label><input type="number" id="pb-amount" value="${d.balance}"></div>
        <div class="field"><label>收款方式</label>
          <select id="pb-method"><option>现金</option><option>微信</option><option>银行卡</option><option>其他</option></select>
        </div>
      </div>
    `, `

      <button class="btn btn-gold" data-act="do-pay-balance" data-id="${d.id}">确认收款并转正式单</button>
    `);
  },

  'do-pay-balance'(el){
    const d = store.deposits.find(x => x.id === el.id);
    const amt = Number($('pb-amount').value) || 0;
    const method = $('pb-method').value;

    if (amt < d.balance){
      d.deposit += amt;
      d.balance -= amt;
      closeModal();
      toast('部分尾款已收，剩余尾款 ' + money(d.balance));
      render();
      return;
    }

    if (d.prodId){
      store.products = store.products.filter(p => p.id !== d.prodId);
    }
    store.sales.unshift({
      id: nextSaleId(), cust: d.cust, prod: d.prod,
      amount: d.total, paid: d.total, method, date: today(),
      type:'final', status:'已完成',
    });

    const cust = store.customers.find(c => c.name === d.cust);
    if (cust) cust.total += d.total;
    store.deposits = store.deposits.filter(x => x.id !== d.id);

    closeModal();
    toast('全额付清 · 已转为正式销售单并扣减库存');
    state.view = 'deposits';
    render();
  },

  },

  'new-customer'(){
    openModal('新增客户', `
      <div class="form-grid">
        <div class="field"><label>客户姓名</label><input id="nc-name" placeholder="姓名"></div>
        <div class="field"><label>手机号</label><input id="nc-phone" placeholder="手机号"></div>
        <div class="field"><label>会员等级</label>
          <select id="nc-level"><option>金卡</option><option>银卡</option><option>普通</option></select>
        </div>
        <div class="field"><label>生日</label><input id="nc-birth" placeholder="如：10-12"></div>
        <div class="field field-full"><label>偏好</label><input id="nc-prefer" placeholder="如：黄金·古法"></div>
      </div>
    `, `
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-gold" data-act="do-new-customer">保存</button>
    `);
  },
  'do-new-customer'(){
    const name = $('nc-name').value.trim();
    if (!name){ toast('请填写客户姓名'); return; }
    store.customers.push({
      id: store.customers.length + 1, name,
      phone: $('nc-phone').value || '—',
      level: $('nc-level').value, total:0, due:0,
      birthday: $('nc-birth').value || '—',
      prefer: $('nc-prefer').value || '—',
    });
    closeModal();
    toast('客户已建档 · ' + name);
    render();
  },
  'cust-detail'(el){
    const c = store.customers.find(x => x.id === Number(el.id));
    openModal('客户详情', `
      <div class="form-grid">
        <div><span style="font-size:12px;color:var(--text-2);">客户</span><div style="font-weight:600;margin-top:4px;">${c.name} (${c.level})</div></div>
        <div><span style="font-size:12px;color:var(--text-2);">电话</span><div style="font-weight:600;margin-top:4px;">${c.phone}</div></div>
        <div><span style="font-size:12px;color:var(--text-2);">累计消费</span><div style="font-weight:700;color:var(--wine);margin-top:4px;">${money(c.total)}</div></div>
        <div><span style="font-size:12px;color:var(--text-2);">欠款</span><div style="font-weight:700;color:${c.due>0?'var(--red)':'var(--text-2)'};margin-top:4px;">${c.due>0?money(c.due):'无欠款'}</div></div>
      </div>
    `, `<button class="btn btn-ghost" onclick="closeModal()">关闭</button>`);
  },
  'collect'(el){
    const c = store.customers.find(x => x.id === Number(el.id));
    toast('已向 ' + c.name + ' 发送催收对账单');
  }
};

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav){ state.view = nav.dataset.nav; state.params = {}; render(); return; }
  const act = e.target.closest('[data-act]');
  if (act){
    const fn = actions[act.dataset.act];
    if (fn){ e.preventDefault(); fn(act.dataset); }
  }
});

render();
</script>
</body>
</html>
