<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>扫描助手 · 盘点</title>
<style>
  :root{
    --wine:#8b1e3f; --green:#1a7f37; --red:#c0392b; --blue:#2563eb; --orange:#d97706;
    --bg:#f2f0ec; --card:#fff; --line:#e2ddd4; --tx:#2b2622; --tx2:#8a8177;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--tx); font-size:15px;
    display:flex; flex-direction:column; max-width:520px; margin:0 auto;
  }
  .top{
    background:var(--wine); color:#fff; padding:8px 12px; flex:none;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .top .t{font-size:17px; font-weight:700; flex:1;}
  .top button{background:rgba(255,255,255,.15); border:none; color:#fff; font-size:14px; padding:7px 12px; border-radius:8px;}
  /* 状态条 */
  .chips{display:flex; gap:6px; flex-wrap:wrap; padding:8px 12px 0; flex:none;}
  .chip{font-size:14px; padding:4px 10px; border-radius:99px; background:#fff; border:1px solid var(--line); color:var(--tx2);}
  .chip.ok{color:var(--green); border-color:#bfe3c8; background:#f0faf3;}
  .chip.warn{color:var(--red); border-color:#f2c4bd; background:#fdf1ef;}
  .chip.pwr{color:var(--blue); border-color:#c7d7f7; background:#f2f7ff;}
  main{flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px;}
  /* 统计 */
  .stats{display:flex; gap:8px; flex:none;}
  .stat{flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center;}
  .stat .n{font-size:24px; font-weight:800; line-height:1.1;}
  .stat .l{font-size:14px; color:var(--tx2); margin-top:3px;}
  .stat.mine .n{color:var(--green);} .stat.pend .n{color:var(--orange);} .stat.total .n{color:var(--blue);}
  .verdict-row{display:flex; gap:8px; flex:none;}
  .verdict{flex:1; border-radius:10px; padding:8px 6px; text-align:center; font-size:14px; border:1px solid var(--line); background:#fff;}
  .verdict b{display:block; font-size:18px; margin-top:2px;}
  .verdict.in b{color:var(--green);} .verdict.ot b{color:var(--red);} .verdict.uk b{color:var(--orange);}
  /* 扳机大按钮 */
  .trigger{
    width:100%; border:none; border-radius:14px; padding:18px; font-size:18px; font-weight:700;
    color:#fff; background:var(--blue); flex:none;
  }
  .trigger.scan{background:var(--red); animation:pulse 1s infinite;}
  .trigger.ready{background:var(--green);}
  .trigger:disabled{opacity:.55;}
  .trigger:active{transform:scale(.99);}
  @keyframes pulse{50%{opacity:.7;}}
  /* 摄像头取景 */
  .camwrap{display:none; position:relative; width:100%; border-radius:12px; overflow:hidden; background:#000; flex:none;}
  .camwrap.on{display:block;}
  .camwrap video{width:100%; display:block;}
  .camwrap .cam-tip{position:absolute; left:0; right:0; bottom:0; padding:6px 10px; font-size:14px; color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.7));}
  /* 列表 */
  .list{display:flex; flex-direction:column; gap:6px;}
  .item{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 10px; display:flex; align-items:center; gap:8px;}
  .item .bdg{font-size:14px; padding:2px 8px; border-radius:99px; flex:none; color:#fff;}
  .item .info{flex:1; min-width:0;}
  .item .nm{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item .sub{font-size:14px; color:var(--tx2);}
  .item.pending{border-color:#f0d9a8; background:#fffaef;}
  .empty{color:var(--tx2); text-align:center; padding:24px 0; font-size:14px;}
  .more{color:var(--tx2); text-align:center; font-size:14px; padding:6px 0;}
  /* 设置面板 */
  .mask{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:none;}
  .mask.on{display:block;}
  .panel{
    position:fixed; left:0; right:0; bottom:0; z-index:21; background:#fff;
    border-radius:16px 16px 0 0; padding:16px; max-width:520px; margin:0 auto;
    display:none; max-height:80vh; overflow-y:auto;
  }
  .panel.on{display:block;}
  .panel h3{font-size:16px; margin-bottom:10px;}
  .prow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid #f0ece5; font-size:14px;}
  .prow input[type=number]{width:90px; border:1px solid var(--line); border-radius:8px; padding:7px; font-size:14px;}
  .prow select{border:1px solid var(--line); border-radius:8px; padding:7px; font-size:14px;}
  .sw{position:relative; width:44px; height:24px; background:#ccc; border-radius:99px; transition:.2s; flex:none;}
  .sw.on{background:var(--green);}
  .sw::after{content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; background:#fff; border-radius:50%; transition:.2s;}
  .sw.on::after{left:22px;}
  .pbtns{display:flex; gap:8px; margin-top:12px;}
  .pbtn{flex:1; border:none; border-radius:10px; padding:11px; font-size:14px; color:#fff; background:var(--wine);}
  .pbtn.gray{background:#8a8177;}
  .toast{
    position:fixed; left:50%; top:14%; transform:translateX(-50%); z-index:99;
    background:rgba(30,26,24,.92); color:#fff; padding:10px 18px; border-radius:10px;
    font-size:14px; max-width:86%; text-align:center; opacity:0; transition:opacity .25s; pointer-events:none;
  }
  .toast.show{opacity:1;}
  .toast.err{background:rgba(140,30,30,.95);}
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.75); color:#fff; z-index:9;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    text-align:center; padding:24px; font-size:15px; line-height:1.6;
  }
</style>
</head>
<body>

<div class="top">
  <span class="t">扫描助手 · 盘点</span>
  <button onclick="scanJoin()">扫码加入</button>
  <button onclick="openPanel()">⚙ 设置</button>
</div>

<div class="chips">
  <span class="chip" id="chNet">连接中…</span>
  <span class="chip" id="chTask">未加入任务</span>
  <span class="chip" id="chMode">网页</span>
  <span class="chip" id="chDevs">设备 0/0</span>
  <span class="chip pwr" id="chPwr" style="display:none">—</span>
  <span class="chip" id="chDev">本机</span>
</div>

<main>
  <div class="stats">
    <div class="stat mine"><div class="n" id="nMine">0</div><div class="l">本机已上报</div></div>
    <div class="stat pend"><div class="n" id="nPend">0</div><div class="l">本地待上传</div></div>
    <div class="stat total"><div class="n" id="nTotal">0</div><div class="l">全局已扫</div></div>
  </div>
  <div class="verdict-row">
    <div class="verdict in">在库<b id="nIn">0</b></div>
    <div class="verdict ot">非在库<b id="nOt">0</b></div>
    <div class="verdict uk">未登记<b id="nUk">0</b></div>
  </div>

  <button class="trigger" id="btnTrigger" onclick="YzTrigger.onTrigger()">扫码加入盘点任务</button>

  <div class="camwrap" id="camwrap">
    <video id="camVideo" playsinline muted></video>
    <div class="cam-tip" id="camTip">摄像头扫码中…</div>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty">扫描到的标签会实时显示在这里（分类由服务端判定）</div>
</main>

<!-- 设置面板 -->
<div class="mask" id="mask" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <h3>扫描参数</h3>
  <div class="prow"><span>状态刷新间隔（秒）</span><input type="number" id="sPull" min="3" max="60"></div>
  <div class="prow" id="rowRssiOn"><span>信号过滤（RSSI）</span><div class="sw" id="sRssiOn" onclick="toggleSw(this)"></div></div>
  <div class="prow" id="rowRssiTh"><span>RSSI 阈值</span><select id="sRssiTh">
    <option value="-60">-60（近）</option><option value="-65">-65</option><option value="-70">-70</option>
    <option value="-75" class="def">-75（默认）</option><option value="-80">-80</option><option value="-85">-85（远）</option>
  </select></div>
  <div class="prow"><span>重复标签提示音</span><div class="sw" id="sDedup" onclick="toggleSw(this)"></div></div>
  <div class="prow"><span>异常震动</span><div class="sw" id="sVib" onclick="toggleSw(this)"></div></div>
  <div class="pbtns">
    <button class="pbtn gray" onclick="leaveTask(true)">退出任务</button>
    <button class="pbtn gray" onclick="closePanel()">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"></div>

<script src="vendor/zxing.min.js"></script>
<script>
'use strict';
// ============================================================================
// 扫描助手 H5（统一任务引擎 · 严格盲采）
//  - 免登录：凭任务 key 参与（?key= 或扫码），设备首次上报自动登记为 h5 设备
//  - 双模式：手持机 App WebView 内走 YzApp UHF 桥（source=rfid）；
//            普通浏览器用本地 zxing 摄像头连续扫条码（source=camera）
//  - 设备不保存任何账面库存，在库/非在库/未登记一律由服务端判定后回显
// ============================================================================

// ---------------- 工具 / 持久化 ----------------
function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function uuid() {
  var k = localStorage.getItem('yz_h5_uuid');
  if (!k) { k = 'H5-' + (Math.random().toString(16) + '0000000').slice(2, 8).toUpperCase(); localStorage.setItem('yz_h5_uuid', k); }
  return k;
}
var _tt;
function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(_tt);
  _tt = setTimeout(function () { t.className = 'toast' + (err ? ' err' : ''); }, 2600);
}
function beep() { try { if (window.YzApp && YzApp.beep) YzApp.beep(); else if (navigator.vibrate) navigator.vibrate(30); } catch (e) {} }
function vibrate(ms) { try { if (window.YzApp && YzApp.vibrate) YzApp.vibrate(ms); else if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// ---------------- 设置 ----------------
var SET = load('yz_stock_set', { pull: 4, rssiOn: true, rssiTh: -75, dedup: true, vib: true });
function saveSet() { save('yz_stock_set', SET); }

// ---------------- 身份（App 桥 / 浏览器）----------------
var DEV = { key: uuid(), name: localStorage.getItem('yz_h5_name') || '网页', stock: 30, ready: false };
var APP = !!(window.YzApp && window.YzApp.stockStart);
(function devInfo() {
  if (!APP) return;
  try { var d = JSON.parse(window.YzApp.device()); DEV = { key: d.key || DEV.key, name: d.name || DEV.name, stock: d.stock || 30, ready: !!d.ready }; APP = true; }
  catch (e) { APP = false; }
})();
// UHF 就绪用 UHF 桥；否则一律摄像头自主
function mode() { return (APP && DEV.ready) ? 'uhf' : 'camera'; }

// ---------------- 任务态 ----------------
var CFG = load('yz_stock_cfg', { origin: '', key: '', taskNo: '', deviceNo: 0, sinceId: 0 });
var joined = false, active = false, scanning = false, netOk = false;
var PENDING = load('yz_stock_pending', {});   // epc -> {rssi, source}
var SCANNED = {};                              // epc -> true（本机去重）
var ITEMS = {};                                // id -> {id,epc,device_no,source,verdict}
var STATS = { in_store: 0, other_store: 0, unknown: 0, total: 0 };
var mine = 0, onlineDevs = 0, totalDevs = 0;
var flushBusy = false, observeBusy = false;

function origin() {
  var o = (CFG.origin || '').replace(/\/+$/, '');
  if (!o) o = location.origin;
  return o;
}
function enc(s) { return encodeURIComponent(s || ''); }

// ---------------- 网络（key 通道，免登录）----------------
function api(path, method, body) {
  var sep = path.indexOf('?') >= 0 ? '&' : '?';
  var url = origin() + path + sep + 'key=' + enc(CFG.key) + '&device=' + enc(DEV.key);
  var opt = { method: method || 'GET' };
  if (body) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
  return fetch(url, opt).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.detail || ('HTTP ' + r.status)); e.code = r.status; throw e; }
      return j;
    });
  });
}

// ---------------- 二维码 / 加入 ----------------
window.YzScanner = {
  onResult: function (code, type) { if (type === 'qrcode') handleQr(code); },
  onState: function (on) { setScanning(!!on); },
  onTags: function (tags) { onTags(tags || []); }
};
window.YzTrigger = {
  onTrigger: function () {
    if (canScan()) {
      if (mode() === 'uhf') { if (scanning) YzApp.stockStop(); else YzApp.stockStart(); }
      else { if (scanning) stopCamera(); else startCamera(); }
    } else if (CFG.key) {
      join();
    } else {
      scanJoin();
    }
  }
};

// 从未加入：App 用桥扫二维码；浏览器可选摄像头扫二维码或粘贴
function scanJoin() {
  if (window.YzApp && YzApp.scan) { YzApp.scan('qrcode'); return; }
  if (!window.ZXing) { manualJoin(); return; }
  if (!confirm('用摄像头扫描任务二维码？\n（点“取消”可手动粘贴任务链接）')) { manualJoin(); return; }
  startQrCamera();
}
function manualJoin() {
  var u = prompt('粘贴任务二维码内容（含 /api/device/claim?key= 或 /stock.html?key=）：');
  if (u) handleQr(u);
}

// 支持：claim URL、stock.html URL、裸 key
function handleQr(raw) {
  var s = String(raw || '').trim();
  if (!s) return;
  var low = s.toLowerCase();
  if (low.indexOf('/api/stocktake/co/') >= 0 || low.indexOf('/co/join') >= 0) {
    toast('这是旧版协同盘点码，请在网页端重新开启任务后扫描新任务码', true); return;
  }
  if (low.indexOf('/stocktake/upload') >= 0) {
    toast('这是旧版单人盘点码，请在网页端开启盘点任务后扫描', true); return;
  }
  var oM = s.match(/^(https?:\/\/[^\/]+)/i);
  var kM = s.match(/[?&]key=([^&]+)/);
  if (oM && kM) { CFG.origin = oM[1]; CFG.key = decodeURIComponent(kM[1]); }
  else if (!/^https?:\/\//i.test(s) && s.indexOf(' ') < 0 && s.length >= 8) { CFG.key = s; if (!CFG.origin) CFG.origin = location.origin; }
  else { toast('无法识别的任务二维码', true); return; }
  save('yz_stock_cfg', CFG);
  join();
}

function join() {
  if (!CFG.key) { toast('请先扫码加入任务', true); return; }
  // observe 即对 key 的有效性与任务状态做校验
  CFG.sinceId = 0;
  clearTaskData();   // 先清旧任务残留，再拉新任务增量，杜绝跨任务串数据
  observe(true).then(function () {
    joined = true; netOk = true;
    toast('已加入任务 ' + CFG.taskNo + '，本机编号 ' + (CFG.deviceNo || '-'));
    refreshUi();
  }).catch(function (e) {
    joined = false; netOk = false;
    if (e.code === 403 || e.code === 404) { resetTask(false); toast('任务密钥无效，请重新扫码', true); }
    else toast('加入失败：' + e.message, true);
    refreshUi();
  });
}

function leaveTask(hint) {
  stopAllScan();
  resetTask(true);
  if (hint) toast('已退出任务，请扫码加入新任务');
}
// 清空任务数据态（不动 CFG 身份/密钥），防止跨任务把旧待上报标签带到新任务
function clearTaskData() {
  PENDING = {}; SCANNED = {}; ITEMS = {}; mine = 0;
  STATS = { in_store: 0, other_store: 0, unknown: 0, total: 0 };
  onlineDevs = totalDevs = 0;
  save('yz_stock_pending', PENDING);
}
function resetTask(keepOrigin) {
  joined = false; active = false;
  clearTaskData();
  CFG.key = ''; CFG.taskNo = ''; CFG.deviceNo = 0; CFG.sinceId = 0;
  if (!keepOrigin) CFG.origin = '';
  save('yz_stock_cfg', CFG);
  refreshUi();
}

// ---------------- 扫描输入 ----------------
function canScan() { return joined && active; }
function setScanning(on) { scanning = !!on; refreshUi(); }

function ingest(epcRaw, rssi, source) {
  var epc = String(epcRaw || '').trim().toUpperCase();
  if (!epc) return;
  if (SET.rssiOn && mode() === 'uhf' && rssi && rssi < SET.rssiTh) return;
  if (SCANNED[epc] || PENDING[epc]) { if (!SET.dedup) beep(); return; }
  SCANNED[epc] = true;
  PENDING[epc] = { rssi: rssi || 0, source: source };
  beep();
  save('yz_stock_pending', PENDING);
  renderStats(); renderList();
}
// UHF 批量标签（App 桥）
function onTags(tags) {
  if (!scanning || mode() !== 'uhf') return;
  tags.forEach(function (t) { ingest(t.epc, t.rssi || 0, 'rfid'); });
}

// ---------------- 摄像头（本地 zxing，无 CDN）----------------
var zxReader = null, zxControls = null, zxMode = null; // 'code' | 'qr'
function camEl() { return document.getElementById('camwrap'); }
function startCamera() { startDecode('code', '摄像头扫码中，对准条码/二维码标签'); }
function startQrCamera() { startDecode('qr', '请扫描任务二维码'); }
function startDecode(use, tip) {
  if (!window.ZXing) { toast('扫码库未加载，请改用手动粘贴', true); return; }
  stopCamera(false);
  zxMode = use;
  document.getElementById('camTip').textContent = tip;
  camEl().className = 'camwrap on';
  try {
    zxReader = new ZXing.BrowserMultiFormatReader();
    var p = zxReader.decodeFromVideoDevice(undefined, document.getElementById('camVideo'), function (result) {
      if (!result || !result.getText) return;
      var text = result.getText();
      if (zxMode === 'qr') { stopCamera(); handleQr(text); }
      else { ingest(text, 0, 'camera'); }
    });
    if (p && p.then) p.then(function (controls) { zxControls = controls; }, function (err) {
      camEl().className = 'camwrap'; scanning = false; refreshUi();
      toast('无法打开摄像头：' + ((err && err.message) || '权限被拒或被占用'), true);
    });
    scanning = true; refreshUi();
  } catch (e) {
    camEl().className = 'camwrap'; scanning = false; refreshUi();
    toast('无法打开摄像头：' + (e && e.message ? e.message : '权限被拒'), true);
  }
}
function stopCamera(doRefresh) {
  zxMode = null;
  try { if (zxControls && zxControls.stop) zxControls.stop(); } catch (e) {}
  try { if (zxReader) zxReader.reset(); } catch (e) {}
  zxReader = null; zxControls = null;
  var v = document.getElementById('camVideo');
  if (v && v.srcObject) { try { v.srcObject.getTracks().forEach(function (tk) { tk.stop(); }); } catch (e) {} v.srcObject = null; }
  camEl().className = 'camwrap';
  scanning = false;
  if (doRefresh !== false) refreshUi();
}
function stopAllScan() {
  try { if (mode() === 'uhf' && APP && scanning && YzApp.stockStop) YzApp.stockStop(); } catch (e) {}
  stopCamera(false);
}

// ---------------- 上报（盲采，服务端排重+分类）----------------
function flush() {
  if (!joined || flushBusy) return;
  var keys = Object.keys(PENDING);
  if (!keys.length) return;
  flushBusy = true;
  // 按来源分组
  var groups = {};
  keys.forEach(function (k) { var s = PENDING[k].source || 'camera'; (groups[s] = groups[s] || []).push(k); });
  var chain = Promise.resolve();
  Object.keys(groups).forEach(function (src) {
    var ks = groups[src];
    chain = chain.then(function () {
      return api('/api/device/scan', 'POST', {
        device: DEV.key, name: DEV.name, source: src,
        tags: ks.map(function (k) { return { epc: k, rssi: PENDING[k].rssi || 0 }; })
      }).then(function (resp) {
        ks.forEach(function (k) { delete PENDING[k]; });
        if (resp.device_no) CFG.deviceNo = resp.device_no;
        if (typeof resp.mine === 'number') mine = resp.mine;
        if (resp.stats) STATS = resp.stats;
        netOk = true;
        save('yz_stock_pending', PENDING);
      });
    });
  });
  chain.then(function () {
    if (!active) return;
    renderStats(); renderList();
  }).catch(function (e) {
    if (e.code === 403 || e.code === 404) { resetTask(false); toast('任务密钥无效，请重新扫码', true); }
    else if (e.code === 409) { handleClosed('任务已结束，停止扫描'); }
    else { netOk = false; renderChips(); }
  }).then(function () { flushBusy = false; });
}

// ---------------- 观察（状态/设备/统计/流水）----------------
function observe(initial) {
  if (observeBusy && !initial) return Promise.resolve();
  observeBusy = true;
  var since = initial ? 0 : (CFG.sinceId || 0);
  return api('/api/task/observe' + '?since_id=' + since, 'GET').then(function (resp) {
    netOk = true;
    CFG.taskNo = resp.task_no || CFG.taskNo;
    // 设备在线统计每次全量重算；同时按 device_code 精确识别本机编号
    onlineDevs = 0; totalDevs = 0;
    (resp.devices || []).forEach(function (d) {
      totalDevs++;
      if (d.online) onlineDevs++;
      if (d.device_code === DEV.key && d.device_no) CFG.deviceNo = d.device_no;
    });
    (resp.items || []).forEach(function (o) {
      ITEMS[o.id] = o;
      if (o.id > (CFG.sinceId || 0)) CFG.sinceId = o.id;
      if (o.device_code === DEV.key) SCANNED[o.epc] = true;
    });
    if (resp.stats) STATS = resp.stats;
    mine = 0;
    Object.keys(ITEMS).forEach(function (id) { if (ITEMS[id].device_code === DEV.key) mine++; });
    applyStatus(resp.status, initial);
    save('yz_stock_cfg', CFG);
    renderChips(); renderStats(); renderList();
  }).catch(function (e) {
    if (e.code === 403 || e.code === 404) { if (joined) { resetTask(false); toast('任务密钥无效或已删除，请重新扫码', true); } }
    else { netOk = false; renderChips(); }
    throw e;
  }).then(function () { observeBusy = false; }, function (e) { observeBusy = false; return Promise.reject(e); });
}

function applyStatus(status, initial) {
  if (status === '进行中') {
    if (!active) { active = true; if (!initial) toast('任务进行中'); }
  } else {
    if (active || initial) {
      active = false;
      stopAllScan();
      var map = { '已完成': '任务已完结，差异报告已生成', '已撤销': '任务已被发起端撤销', '已终止': '任务已被发起端终止' };
      handleClosed(map[status] || ('任务状态：' + status));
    }
  }
}
function handleClosed(msg) {
  active = false; joined = false;
  stopAllScan();
  clearTaskData();
  CFG.key = ''; CFG.taskNo = ''; CFG.deviceNo = 0; CFG.sinceId = 0;
  save('yz_stock_cfg', CFG);
  toast(msg, true);
  refreshUi();
}

// ---------------- 心跳（在线灯保活）----------------
function heartbeat() {
  if (!joined || !CFG.key) return;
  api('/api/device/heartbeat', 'POST').then(function (r) {
    netOk = true;
    if (typeof r.mine === 'number') mine = r.mine;
    renderChips(); renderStats();
  }).catch(function () { netOk = false; renderChips(); });
}

// ---------------- 定时器 ----------------
setInterval(function () { if (joined && (scanning || Object.keys(PENDING).length)) flush(); }, 1200);
// observe 节拍由 SET.pull 控制（秒，下限3）
var _lastObserve = 0;
(function observeBeat() {
  setTimeout(function () {
    var now = Date.now();
    if (joined && now - _lastObserve >= Math.max(3, SET.pull) * 1000) { _lastObserve = now; observe(false); }
    observeBeat();
  }, 500);
})();
setInterval(function () { if (joined) heartbeat(); }, 12000);

// ---------------- 渲染 ----------------
function verdictBadge(v) {
  if (v === 'in_store') return '<span class="bdg" style="background:var(--green)">在库</span>';
  if (v === 'other_store') return '<span class="bdg" style="background:var(--red)">非在库</span>';
  return '<span class="bdg" style="background:var(--orange)">未登记</span>';
}
function sourceBadge(s) {
  if (s === 'camera') return '<span class="bdg" style="background:#64748b">摄像</span>';
  return '<span class="bdg" style="background:#2563eb">UHF</span>';
}
function renderStats() {
  document.getElementById('nMine').textContent = mine;
  document.getElementById('nPend').textContent = Object.keys(PENDING).length;
  document.getElementById('nTotal').textContent = STATS.total || 0;
  document.getElementById('nIn').textContent = STATS.in_store || 0;
  document.getElementById('nOt').textContent = STATS.other_store || 0;
  document.getElementById('nUk').textContent = STATS.unknown || 0;
}
function renderChips() {
  var chNet = document.getElementById('chNet');
  chNet.textContent = netOk ? '在线' : '离线'; chNet.className = 'chip ' + (netOk ? 'ok' : 'warn');
  var chTask = document.getElementById('chTask');
  chTask.textContent = !joined ? '未加入任务' : (active ? (CFG.taskNo || '盘点中') : '任务已结束');
  chTask.className = 'chip ' + (joined && active ? 'ok' : (joined ? 'warn' : ''));
  var md = mode();
  var chMode = document.getElementById('chMode');
  chMode.textContent = md === 'uhf' ? 'UHF 手持机' : '摄像头';
  chMode.className = 'chip ' + (md === 'uhf' ? 'pwr' : '');
  var od = 0, td = 0;
  // 设备在线统计在 observe 内更新；此处从最近一次数据读取
  document.getElementById('chDevs').textContent = '设备 ' + onlineDevs + '/' + totalDevs;
  var chPwr = document.getElementById('chPwr');
  if (md === 'uhf') { chPwr.style.display = ''; chPwr.textContent = DEV.stock + 'dBm'; }
  else chPwr.style.display = 'none';
  document.getElementById('chDev').textContent = CFG.deviceNo ? ('本机 ' + CFG.deviceNo + ' 号') : '本机';
}
function renderList() {
  var rows = [];
  // 待上传（本机）
  Object.keys(PENDING).forEach(function (epc) {
    rows.push({ id: 'p-' + epc, epc: epc, pending: true, source: PENDING[epc].source, rssi: PENDING[epc].rssi, v: null, no: CFG.deviceNo });
  });
  // 服务端流水（最近在前）
  Object.keys(ITEMS).forEach(function (id) {
    var o = ITEMS[id];
    rows.push({ id: 's-' + o.id, epc: o.epc, pending: false, source: o.source, rssi: 0, v: o.verdict, no: o.device_no });
  });
  rows.sort(function (a, b) {
    if (a.pending !== b.pending) return a.pending ? -1 : 1;
    var ai = parseInt(String(a.id).replace(/\D/g, ''), 10) || 0, bi = parseInt(String(b.id).replace(/\D/g, ''), 10) || 0;
    return bi - ai;
  });
  var MAX = 200, html = '';
  rows.slice(0, MAX).forEach(function (r) {
    var cls = 'item' + (r.pending ? ' pending' : '');
    var bdg = r.pending
      ? '<span class="bdg" style="background:var(--orange)">待上传</span>'
      : verdictBadge(r.v);
    var sub = esc(r.epc) + ' · ' + (r.no ? (r.no + '号机 · ') : '') + (r.rssi ? (r.rssi + 'dBm') : '');
    html += '<div class="' + cls + '">' + bdg + sourceBadge(r.source) +
      '<div class="info"><div class="nm">' + esc(r.epc) + '</div><div class="sub">' + sub + '</div></div></div>';
  });
  document.getElementById('list').innerHTML = html;
  var empty = document.getElementById('empty');
  empty.style.display = rows.length ? 'none' : 'block';
  empty.textContent = joined ? '扫描到的标签会实时显示在这里' : '扫码加入盘点任务后开始扫描';
}
function refreshUi() { renderChips(); renderStats(); renderList();
  var btn = document.getElementById('btnTrigger');
  if (canScan()) {
    if (scanning) { btn.className = 'trigger scan'; btn.textContent = '停止扫描'; }
    else { btn.className = 'trigger ready'; btn.textContent = (mode() === 'uhf' ? '开始 UHF 扫描' : '开始摄像头扫描'); }
  } else {
    btn.className = 'trigger'; btn.textContent = CFG.key ? '重新连接任务…' : '扫码加入盘点任务';
  }
}

// ---------------- 设置面板 ----------------
function openPanel() {
  document.getElementById('sPull').value = SET.pull;
  swSet('sRssiOn', SET.rssiOn); document.getElementById('sRssiTh').value = String(SET.rssiTh);
  swSet('sDedup', SET.dedup); swSet('sVib', SET.vib);
  var uhf = mode() === 'uhf';
  document.getElementById('rowRssiOn').style.display = uhf ? '' : 'none';
  document.getElementById('rowRssiTh').style.display = uhf ? '' : 'none';
  document.getElementById('mask').className = 'mask on';
  document.getElementById('panel').className = 'panel on';
}
function closePanel() {
  var v = parseInt(document.getElementById('sPull').value, 10) || 4;
  SET.pull = v < 3 ? 3 : (v > 60 ? 60 : v);
  SET.rssiTh = parseInt(document.getElementById('sRssiTh').value, 10) || -75;
  SET.rssiOn = document.getElementById('sRssiOn').className.indexOf('on') >= 0;
  SET.dedup = document.getElementById('sDedup').className.indexOf('on') >= 0;
  SET.vib = document.getElementById('sVib').className.indexOf('on') >= 0;
  saveSet();
  document.getElementById('mask').className = 'mask';
  document.getElementById('panel').className = 'panel';
}
function swSet(id, on) { document.getElementById(id).className = 'sw' + (on ? ' on' : ''); }
function toggleSw(el) { el.className = 'sw' + (el.className.indexOf('on') >= 0 ? '' : ' on'); }

// ---------------- 启动 ----------------
(function init() {
  // UHF 功率恢复（App 内）
  if (mode() === 'uhf') {
    try { YzApp.setPower(DEV.stock); } catch (e) {}
  }
  // URL ?key= 直接进入
  var qp = new URLSearchParams(location.search);
  var qk = qp.get('key');
  var qs = qp.get('server') || qp.get('origin');
  if (qk) { CFG.key = qk; if (qs) CFG.origin = qs; else if (!CFG.origin) CFG.origin = location.origin; save('yz_stock_cfg', CFG); }
  refreshUi();
  if (CFG.key) { join(); }
})();
</script>
