<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- 背景渐变：深邃的午夜蓝曜石色 -->
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#181B26" />
      <stop offset="50%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>
    
    <!-- 核心香槟金渐变 -->
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FDF1B8" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A5A19" />
    </linearGradient>

    <!-- 底部渐隐稳重分割线 -->
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>

    <!-- 柔和的云端光晕滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- 强爆闪发光滤镜 -->
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 沉稳的高级暗色底板 -->
  <rect width="800" height="600" fill="url(#bg)" />

  <!-- 核心图腾区域 -->
  <g transform="translate(400, 190)">
    
    <!-- 第一层：最外围的虚线数据星轨 -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="url(#gold)" stroke-width="0.5" stroke-dasharray="3 7" opacity="0.6"/>
    <circle cx="0" cy="0" r="145" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.2"/>

    <!-- 第二层：流动祥云与云端环抱轨迹 -->
    <g filter="url(#glow)">
      <!-- 左上到右下的流线 -->
      <path d="M-110,0 C-110,-70 -40,-120 0,-120 C50,-120 90,-80 110,-30" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
      <!-- 右下到左上的流线，形成环抱闭环 -->
      <path d="M110,-30 C120,40 70,110 0,110 C-50,110 -90,70 -110,30" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
      <!-- 点缀的星点轨迹 -->
      <circle cx="110" cy="-30" r="3" fill="#FDF1B8" />
      <circle cx="-110" cy="30" r="3" fill="#FDF1B8" />
    </g>

    <!-- 第三层：内部精密 12 节点珠宝晶体架构 -->
    <g stroke="url(#gold)" stroke-width="1.5" fill="none" stroke-linejoin="round">
      <!-- 外部多边形晶格 -->
      <polygon points="0,-65 55,-20 35,55 -35,55 -55,-20" fill="rgba(212, 175, 55, 0.04)" />
      <!-- 内部核心晶格 -->
      <polygon points="0,-35 25,-10 15,30 -15,30 -25,-10" fill="rgba(212, 175, 55, 0.08)" />
      
      <!-- 晶格切面连线 -->
      <line x1="0" y1="-65" x2="0" y2="-35" />
      <line x1="55" y1="-20" x2="25" y2="-10" />
      <line x1="35" y1="55" x2="15" y2="30" />
      <line x1="-35" y1="55" x2="-15" y2="30" />
      <line x1="-55" y1="-20" x2="-25" y2="-10" />
    </g>
    
    <!-- 12个几何星芒节点 -->
    <g fill="#FDF1B8" filter="url(#strongGlow)">
      <!-- 外环 5 节点 -->
      <circle cx="0" cy="-65" r="2.5" />
      <circle cx="55" cy="-20" r="2.5" />
      <circle cx="35" cy="55" r="2.5" />
      <circle cx="-35" cy="55" r="2.5" />
      <circle cx="-55" cy="-20" r="2.5" />
      
      <!-- 内环 5 节点 -->
      <circle cx="0" cy="-35" r="1.5" />
      <circle cx="25" cy="-10" r="1.5" />
      <circle cx="15" cy="30" r="1.5" />
      <circle cx="-15" cy="30" r="1.5" />
      <circle cx="-25" cy="-10" r="1.5" />
      
      <!-- 中心 2 节点汇聚成极光核心 -->
      <circle cx="0" cy="5" r="4" fill="#FFFFFF" />
      <path d="M0,-5 L2,5 L10,7 L2,9 L0,19 L-2,9 L-10,7 L-2,5 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ================= 修改重点区域：文字与底座 ================= -->

  <!-- 中文主品牌文字：采用厚重的中宋/加粗宋体，字重提升至 800 带来极强的稳重感 -->
  <!-- 适当收拢字间距(14)，让字体力量更凝聚 -->
  <text x="406" y="440" 
        font-family="'STZhongsong', 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', serif" 
        font-size="46" 
        font-weight="800" 
        fill="url(#gold)" 
        text-anchor="middle" 
        letter-spacing="14">懿臻珠宝云</text>
        
  <!-- 英文翻译：字重加粗到 600，支撑起上方厚重的中文 -->
  <text x="406" y="485" 
        font-family="'Optima', 'Cinzel', 'Times New Roman', serif" 
        font-size="15" 
        font-weight="600" 
        fill="#A0A0A0" 
        text-anchor="middle" 
        letter-spacing="12">YIZHEN JEWELRY CLOUD</text>

  <!-- 稳重的视觉底座：中间实、两端虚，提供强烈的“大地”支撑感 -->
  <rect x="250" y="515" width="312" height="2" fill="url(#lineFade)" />
  
  <!-- 底层说明：同样做加粗处理，收稳底盘 -->
  <text x="406" y="545" 
        font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" 
        font-size="11" 
        font-weight="600" 
        fill="#666666" 
        text-anchor="middle" 
        letter-spacing="10">ENTERPRISE SYSTEM</text>
</svg>
