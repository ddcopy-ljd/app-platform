<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>问题上报 · BugPulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-size: 16px; }
    .seg-active { background: #2563eb; color: #fff; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <script>
    /* 网关注入 window.__APP_BASE__（/app/bugtracker/{tenant}/）；直连为空串 */
    var API = (window.__APP_BASE__ || '').replace(/\/+$/, '');
    var Q = new URLSearchParams(location.search);
  </script>

  <!-- 顶栏 -->
  <header class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-4 pt-5 pb-6">
    <div class="max-w-xl mx-auto">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🐞</span>
        <div>
          <h1 class="text-lg font-bold leading-tight">问题上报</h1>
          <p class="text-blue-100" style="font-size:14px">提交后由质量团队跟进处理</p>
        </div>
      </div>
      <div id="srcBanner" class="hidden mt-3 bg-white/15 rounded-lg px-3 py-2" style="font-size:14px">
        正在为 <span id="srcName" class="font-bold"></span> 上报
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-5">

    <!-- 表单态 -->
    <div id="formBox" class="space-y-4">
      <div class="bg-white rounded-xl shadow-sm p-4 space-y-4">

        <!-- 类型 -->
        <div>
          <label class="block text-slate-600 font-medium mb-1.5" style="font-size:14px">类型 <span class="text-red-500">*</span></label>
          <div class="grid grid-cols-2 gap-2" id="kindSeg">
            <button type="button" data-kind="缺陷" class="seg-active rounded-lg border border-slate-300 py-2.5 font-medium">🐞 缺陷</button>
            <button type="button" data-kind="需求" class="rounded-lg border border-slate-300 py-2.5 font-medium text-slate-600">✨ 需求</button>
          </div>
        </div>

        <!-- 来源插件 -->
        <div>
          <label class="block text-slate-600 font-medium mb-1.5" style="font-size:14px">来源应用 <span class="text-red-500">*</span></label>
          <input id="fSource" maxlength="32" placeholder="如：jewelry"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-blue-500">
        </div>

        <!-- 标题 -->
        <div>
          <label class="block text-slate-600 font-medium mb-1.5" style="font-size:14px">标题 <span class="text-red-500">*</span></label>
          <input id="fTitle" maxlength="120" placeholder="一句话描述问题"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-blue-500">
        </div>

        <!-- 描述 -->
        <div>
          <label class="block text-slate-600 font-medium mb-1.5" style="font-size:14px">详细说明</label>
          <textarea id="fDetail" rows="4" maxlength="2000" placeholder="复现步骤 / 期望效果 / 出现时间等"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-blue-500 resize-y"></textarea>
        </div>

        <!-- 截图 -->
        <div>
          <label class="block text-slate-600 font-medium mb-1.5" style="font-size:14px">现场截图（最多 3 张，自动压缩）</label>
          <div class="flex flex-wrap gap-2" id="imgBox">
            <label id="imgAdd" class="w-20 h-20 rounded-lg border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 cursor-pointer active:bg-slate-50">
              <span class="text-2xl leading-none">＋</span>
              <span style="font-size:14px">添加</span>
              <input id="fImg" type="file" accept="image/*" multiple class="hidden">
            </label>
          </div>
        </div>

        <!-- 上报人 -->
        <div>
          <label class="block text-slate-600 font-medium mb-1.5" style="font-size:14px">您的姓名 <span class="text-red-500">*</span></label>
          <input id="fReporter" maxlength="32" placeholder="便于跟进联系"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-blue-500">
        </div>
      </div>

      <div id="errBox" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-lg px-3 py-2.5" style="font-size:14px"></div>

      <button id="btnSubmit" class="w-full bg-blue-600 active:bg-blue-700 disabled:opacity-50 text-white font-bold rounded-xl py-3.5 shadow">
        提交上报
      </button>
      <p class="text-center text-slate-400" style="font-size:14px">提交即表示同意该信息被质量团队查看与跟进</p>
    </div>

    <!-- 成功态 -->
    <div id="okBox" class="hidden bg-white rounded-xl shadow-sm p-8 text-center">
      <div class="w-16 h-16 mx-auto rounded-full bg-green-100 flex items-center justify-center">
        <svg class="w-9 h-9 text-green-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </div>
      <h2 class="mt-4 text-xl font-bold text-slate-800">上报成功</h2>
      <p class="mt-2 text-slate-500" style="font-size:14px">受理编号</p>
      <p id="okCode" class="text-2xl font-mono font-bold text-blue-600 mt-1"></p>
      <p class="mt-3 text-slate-500" style="font-size:14px">我们已收到您的问题，会尽快跟进处理。</p>
      <button id="btnAgain" class="mt-6 w-full bg-slate-100 active:bg-slate-200 text-slate-700 font-medium rounded-xl py-3">继续上报</button>
    </div>
  </main>

  <script>
    var ST = { kind: '缺陷', imgs: [] };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // URL 参数预填
    (function init() {
      var src = (Q.get('source') || '').trim();
      if (src) { document.getElementById('fSource').value = src; }
      var user = (Q.get('user') || '').trim();
      if (user) { document.getElementById('fReporter').value = user; }
    })();

    // 类型切换
    document.getElementById('kindSeg').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-kind]');
      if (!btn) return;
      ST.kind = btn.dataset.kind;
      document.querySelectorAll('#kindSeg button').forEach(function (b) {
        var on = b === btn;
        b.classList.toggle('seg-active', on);
        b.classList.toggle('text-slate-600', !on);
      });
    });

    function showErr(msg) {
      var box = document.getElementById('errBox');
      box.textContent = msg;
      box.classList.remove('hidden');
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // 图片：长边 800 压缩为 JPEG，≤3 张
    document.getElementById('fImg').addEventListener('change', function () {
      var files = Array.prototype.slice.call(this.files || []);
      this.value = '';
      files.forEach(function (file) {
        if (!/^image\//.test(file.type)) return;
        if (ST.imgs.length >= 3) { showErr('截图最多 3 张'); return; }
        var reader = new FileReader();
        reader.onload = function () {
          var img = new Image();
          img.onload = function () {
            var MAX = 800, w = img.width, h = img.height, scale = Math.min(1, MAX / Math.max(w, h));
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(w * scale);
            canvas.height = Math.round(h * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            var dataUrl = canvas.toDataURL('image/jpeg', 0.75);
            ST.imgs.push({
              dataUrl: dataUrl, width: canvas.width, height: canvas.height,
              bytes: Math.round(dataUrl.length * 0.75), origSize: file.size + 'B'
            });
            renderImgs();
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    });

    function renderImgs() {
      var box = document.getElementById('imgBox');
      box.querySelectorAll('[data-thumb]').forEach(function (n) { n.remove(); });
      var add = document.getElementById('imgAdd');
      ST.imgs.forEach(function (im, i) {
        var d = document.createElement('div');
        d.setAttribute('data-thumb', i);
        d.className = 'relative w-20 h-20 rounded-lg overflow-hidden border border-slate-200';
        d.innerHTML = '<img src="' + im.dataUrl + '" class="w-full h-full object-cover">' +
          '<button type="button" data-del="' + i + '" class="absolute top-0 right-0 w-6 h-6 bg-black/60 text-white rounded-bl-lg leading-none">×</button>';
        box.insertBefore(d, add);
      });
      add.classList.toggle('hidden', ST.imgs.length >= 3);
    }

    document.getElementById('imgBox').addEventListener('click', function (e) {
      var del = e.target.closest('button[data-del]');
      if (!del) return;
      ST.imgs.splice(+del.dataset.del, 1);
      renderImgs();
    });

    // 提交
    document.getElementById('btnSubmit').addEventListener('click', function () {
      var source = document.getElementById('fSource').value.trim();
      var reporter = document.getElementById('fReporter').value.trim();
      var title = document.getElementById('fTitle').value.trim();
      var detail = document.getElementById('fDetail').value.trim();
      if (!source) return showErr('请填写来源应用');
      if (!title) return showErr('请填写问题标题');
      if (!reporter) return showErr('请填写您的姓名');
      var btn = this;
      btn.disabled = true;
      btn.textContent = '提交中…';
      fetch(API + '/api/report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source: source, reporter: reporter, title: title, kind: ST.kind, detail: detail, images: ST.imgs })
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      }).then(function (res) {
        if (!res.ok) throw new Error(res.j.detail || '提交失败，请稍后再试');
        document.getElementById('okCode').textContent = res.j.code;
        document.getElementById('formBox').classList.add('hidden');
        document.getElementById('okBox').classList.remove('hidden');
        window.scrollTo(0, 0);
      }).catch(function (e) {
        showErr(e.message || '网络异常，请稍后再试');
      }).finally(function () {
        btn.disabled = false;
        btn.textContent = '提交上报';
      });
    });

    document.getElementById('btnAgain').addEventListener('click', function () {
      document.getElementById('fTitle').value = '';
      document.getElementById('fDetail').value = '';
      ST.imgs = [];
      renderImgs();
      document.getElementById('errBox').classList.add('hidden');
      document.getElementById('okBox').classList.add('hidden');
      document.getElementById('formBox').classList.remove('hidden');
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
