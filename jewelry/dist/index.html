<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>懿珠宝管家</title>
  <style>
    :root{
      --gold:#C9A961;
      --gold-light:#E8D5A0;
      --gold-pale:#F5EBD8;
      --gold-dark:#9C7B3A;
      --wine:#5C2233;
      --wine-light:#7A2E42;
      --wine-deep:#421824;
      --cream:#FBF6EC;
      --card:#FFFFFF;
      --text:#3D2B1F;
      --text-2:#7A6A55;
      --border:#EADFC8;
      --red:#A8362F;
      --green:#5B7A3A;
      --blue:#3A5A7A;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
      background:var(--cream);color:var(--text);font-size:14px;
      -webkit-font-smoothing:antialiased;
    }
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
    input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);}
    table{width:100%;border-collapse:collapse;}
    .serif{font-family:"Songti SC","STSong","SimSun",serif;}

    .app{display:flex;min-height:100vh;}
    .sidebar{
      width:248px;flex-shrink:0;
      background:linear-gradient(180deg,var(--wine) 0%,var(--wine-deep) 100%);
      color:#F5E9DA;display:flex;flex-direction:column;position:relative;
    }
    .sidebar::after{
      content:"";position:absolute;right:0;top:0;bottom:0;width:1px;
      background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:.5;
    }
    .brand{
      height:78px;display:flex;align-items:center;gap:12px;padding:0 22px;
      border-bottom:1px solid rgba(201,169,97,.25);
    }
    .brand-mark{
      width:40px;height:40px;border-radius:50%;
      background:linear-gradient(135deg,#E8D5A0,#C9A961 45%,#9C7B3A);
      display:flex;align-items:center;justify-content:center;
      font-size:19px;color:#5C2233;font-weight:700;flex-shrink:0;
      box-shadow:0 3px 10px rgba(201,169,97,.4),inset 0 1px 2px rgba(255,255,255,.6);
    }
    .brand-text{line-height:1.25;}
    .brand-name{font-size:16px;font-weight:600;letter-spacing:1px;color:#F7EFE0;}
    .brand-sub{font-size:10px;letter-spacing:2px;color:var(--gold);opacity:.85;margin-top:2px;}

    .store-switch{
      margin:14px 16px 10px;padding:12px 14px;border-radius:8px;
      background:linear-gradient(135deg,rgba(201,169,97,.18),rgba(201,169,97,.08));
      border:1px solid rgba(201,169,97,.35);
      display:flex;align-items:center;gap:10px;cursor:pointer;
      transition:all .18s;position:relative;
    }
    .store-switch:hover{background:rgba(201,169,97,.22);}
    .store-ico{font-size:16px;}
    .store-info{flex:1;min-width:0;}
    .store-name{font-size:13px;font-weight:600;color:#F7EFE0;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .store-arrow{font-size:10px;color:rgba(201,169,97,.7);}

    .nav-item{
      display:flex;align-items:center;gap:12px;
      padding:11px 22px;font-size:14px;color:rgba(245,233,218,.72);
      cursor:pointer;position:relative;transition:all .2s;
      border-left:3px solid transparent;
    }
    .nav-item:hover{color:#F7EFE0;background:rgba(201,169,97,.08);}
    .nav-item.active{
      color:#F7EFE0;
      background:linear-gradient(90deg,rgba(201,169,97,.22),transparent);
      border-left-color:var(--gold);
    }
    .nav-item.active::before{
      content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
      background:linear-gradient(180deg,var(--gold-light),var(--gold));
      box-shadow:0 0 12px rgba(201,169,97,.8);
    }
    .nav-ico{font-size:15px;width:20px;text-align:center;}
    .nav-badge{
      margin-left:auto;background:var(--gold);color:var(--wine-deep);
      font-size:10px;padding:1px 7px;border-radius:8px;font-weight:600;
    }
    .sidebar-foot{
      margin-top:auto;padding:16px 22px;
      border-top:1px solid rgba(201,169,97,.25);
      display:flex;align-items:center;gap:12px;
    }
    .avatar{
      width:36px;height:36px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,#E8D5A0,#C9A961);
      display:flex;align-items:center;justify-content:center;
      color:#5C2233;font-weight:600;font-size:14px;
    }
    .foot-info{font-size:13px;line-height:1.35;color:#F5E9DA;flex:1;min-width:0;}
    .foot-info small{display:block;font-size:10px;color:rgba(201,169,97,.7);letter-spacing:.5px;margin-top:2px;}

    .main{flex:1;display:flex;flex-direction:column;min-width:0;}
    .topbar{
      min-height:78px;display:flex;align-items:center;justify-content:space-between;
      padding:0 32px;background:var(--card);
      border-bottom:1px solid var(--border);position:relative;gap:20px;
    }
    .topbar::after{
      content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6;
    }
    .crumb{font-size:13px;color:var(--text-2);letter-spacing:.5px;display:flex;align-items:center;gap:12px;}
    .crumb b{color:var(--text);font-weight:600;font-size:15px;letter-spacing:.5px;}
    .store-pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 12px;border-radius:14px;font-size:12px;
      background:linear-gradient(135deg,#F7EFE0,#EFE2C6);
      border:1px solid #E5D3A8;color:var(--gold-dark);letter-spacing:.5px;
    }
    .top-actions{display:flex;align-items:center;gap:14px;}
    .top-date{font-size:12px;color:var(--text-2);letter-spacing:.5px;padding-right:12px;border-right:1px solid var(--border);}
    .content{flex:1;padding:26px 32px 40px;overflow:auto;}

    .card{
      background:var(--card);border-radius:10px;padding:24px;
      border:1px solid var(--border);
      box-shadow:0 1px 2px rgba(92,34,51,.04),0 8px 24px -12px rgba(92,34,51,.08);
    }
    .card+.card{margin-top:18px;}
    .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
    .card-title{font-size:16px;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:10px;}
    .card-title::before{
      content:"";width:3px;height:16px;border-radius:2px;
      background:linear-gradient(180deg,var(--gold-light),var(--gold-dark));
    }
    .card-title small{font-weight:400;font-size:12px;color:var(--text-2);letter-spacing:.3px;}

    .btn{
      display:inline-flex;align-items:center;gap:6px;
      padding:8px 18px;border-radius:6px;font-size:13px;letter-spacing:.5px;transition:all .18s;
    }
    .btn-gold{
      background:linear-gradient(135deg,#E0C87F,#C9A961 50%,#B08D45);
      color:#fff;box-shadow:0 2px 8px rgba(201,169,97,.35);
      text-shadow:0 1px 1px rgba(140,100,20,.3);
    }
    .btn-gold:hover{box-shadow:0 4px 14px rgba(201,169,97,.55);transform:translateY(-1px);}
    .btn-wine{background:var(--wine);color:#F5E9DA;}
    .btn-wine:hover{background:var(--wine-light);}
    .btn-outline{border:1px solid var(--border);color:var(--text-2);}
    .btn-outline:hover{border-color:var(--gold);color:var(--gold-dark);}

    .stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
    .stat-card{
      background:var(--card);border-radius:10px;padding:20px;
      border:1px solid var(--border);
      box-shadow:0 1px 2px rgba(92,34,51,.04);
    }
    .stat-label{font-size:12px;color:var(--text-2);margin-bottom:8px;}
    .stat-value{font-size:28px;font-weight:700;color:var(--wine);}
    .stat-value.gold{color:var(--gold-dark);}

    .data-table{width:100%;}
    .data-table th{
      text-align:left;padding:12px 16px;font-size:12px;color:var(--text-2);
      border-bottom:1px solid var(--border);font-weight:600;letter-spacing:.5px;
    }
    .data-table td{
      padding:12px 16px;border-bottom:1px solid #F5F0E5;font-size:13px;
    }
    .data-table tr:hover td{background:var(--gold-pale);}

    .tag{
      display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.5px;
    }
    .tag-green{background:#E8F5E9;color:var(--green);}
    .tag-gold{background:var(--gold-pale);color:var(--gold-dark);}
    .tag-red{background:#FFEBEE;color:var(--red);}
    .tag-blue{background:#E3F2FD;color:var(--blue);}

    .search-bar{display:flex;gap:12px;margin-bottom:18px;}
    .search-bar input,.search-bar select{
      padding:8px 14px;border:1px solid var(--border);border-radius:6px;
      background:var(--card);
    }
    .search-bar input:focus,.search-bar select:focus{outline:none;border-color:var(--gold);}

    .modal-overlay{
      position:fixed;top:0;left:0;right:0;bottom:0;
      background:rgba(61,43,31,.5);display:flex;align-items:center;justify-content:center;z-index:1000;
    }
    .modal{
      background:var(--card);border-radius:12px;padding:24px;min-width:500px;max-width:800px;
      box-shadow:0 20px 60px rgba(92,34,51,.2);
    }
    .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .modal-title{font-size:16px;font-weight:600;}
    .modal-close{font-size:20px;color:var(--text-2);cursor:pointer;}
    .modal-close:hover{color:var(--text);}
    .form-group{margin-bottom:16px;}
    .form-label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;}
    .form-input{
      width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:6px;
      background:var(--cream);
    }
    .form-input:focus{outline:none;border-color:var(--gold);}
    .form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;}

    .empty{text-align:center;padding:60px 20px;color:var(--text-2);}
    .empty-ico{font-size:48px;margin-bottom:12px;opacity:.5;}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const API_BASE = '/api/jewelry';
    const TOKEN = 'dev-token-123';
    const TENANT_ID = 1;

    async function api(path, options = {}) {
      const url = `${API_BASE}${path}`;
      const res = await fetch(url, {
        ...options,
        headers: {
          'Authorization': `Bearer ${TOKEN}`,
          'X-Tenant-Id': TENANT_ID,
          'Content-Type': 'application/json',
          ...options.headers
        }
      });
      return res.json();
    }

    createApp({
      setup() {
        const currentView = ref('dashboard');
        const products = ref([]);
        const customers = ref([]);
        const sales = ref([]);
        const deposits = ref([]);
        const stocktakes = ref([]);
        const logs = ref([]);
        const dashboard = ref({});
        const showModal = ref(false);
        const modalType = ref('');
        const formData = ref({});
        const searchKeyword = ref('');
        const filterStatus = ref('');

        const navItems = [
          { key: 'dashboard', name: '经营看板', ico: '📊' },
          { key: 'products', name: '商品管理', ico: '💍' },
          { key: 'inventory', name: '库存管理', ico: '📦' },
          { key: 'sales', name: '销售开单', ico: '🛒' },
          { key: 'deposits', name: '定金尾款', ico: '💰' },
          { key: 'customers', name: '客户管理', ico: '👥' },
          { key: 'stocktakes', name: '库存盘点', ico: '📋' },
          { key: 'logs', name: '操作日志', ico: '📝' },
        ];

        const viewTitle = computed(() => {
          const item = navItems.find(n => n.key === currentView.value);
          return item ? item.name : '';
        });

        async function loadData() {
          if (currentView.value === 'dashboard') {
            const res = await api('/dashboard');
            if (res.code === 0) dashboard.value = res.data;
          } else if (currentView.value === 'products') {
            const res = await api('/products');
            if (res.code === 0) products.value = res.data.items;
          } else if (currentView.value === 'inventory') {
            const res = await api('/inventory');
            if (res.code === 0) products.value = res.data.items;
          } else if (currentView.value === 'sales') {
            const res = await api('/sales');
            if (res.code === 0) sales.value = res.data.items;
          } else if (currentView.value === 'deposits') {
            const res = await api('/deposits');
            if (res.code === 0) deposits.value = res.data.items;
          } else if (currentView.value === 'customers') {
            const res = await api('/customers');
            if (res.code === 0) customers.value = res.data.items;
          } else if (currentView.value === 'stocktakes') {
            const res = await api('/stocktakes');
            if (res.code === 0) stocktakes.value = res.data.items;
          } else if (currentView.value === 'logs') {
            const res = await api('/logs');
            if (res.code === 0) logs.value = res.data.items;
          }
        }

        function openModal(type, data = {}) {
          modalType.value = type;
          formData.value = data || {};
          showModal.value = true;
        }

        function closeModal() {
          showModal.value = false;
          formData.value = {};
        }

        async function submitForm() {
          if (modalType.value === 'product') {
            const res = await api('/products', {
              method: formData.value.id ? 'PUT' : 'POST',
              body: JSON.stringify(formData.value)
            });
            if (res.code === 0) { closeModal(); loadData(); }
          } else if (modalType.value === 'customer') {
            const res = await api('/customers', {
              method: formData.value.id ? 'PUT' : 'POST',
              body: JSON.stringify(formData.value)
            });
            if (res.code === 0) { closeModal(); loadData(); }
          } else if (modalType.value === 'sale') {
            const res = await api('/sales', {
              method: 'POST',
              body: JSON.stringify(formData.value)
            });
            if (res.code === 0) { closeModal(); loadData(); }
          } else if (modalType.value === 'deposit') {
            const res = await api('/deposits', {
              method: 'POST',
              body: JSON.stringify(formData.value)
            });
            if (res.code === 0) { closeModal(); loadData(); }
          } else if (modalType.value === 'stocktake') {
            const res = await api('/stocktakes', {
              method: 'POST',
              body: JSON.stringify(formData.value)
            });
            if (res.code === 0) { closeModal(); loadData(); }
          }
        }

        function getStatusTag(status) {
          const map = {
            '在库': 'tag-green',
            '已定': 'tag-gold',
            '借出': 'tag-blue',
            '已完成': 'tag-green',
            '已收定金': 'tag-gold',
            '已付尾款': 'tag-green',
            '盘点中': 'tag-blue',
            '待审核': 'tag-gold',
            '已完成': 'tag-green',
          };
          return map[status] || 'tag-gold';
        }

        onMounted(() => { loadData(); });

        return {
          currentView, navItems, viewTitle,
          dashboard, products, customers, sales, deposits, stocktakes, logs,
          showModal, modalType, formData, searchKeyword, filterStatus,
          loadData, openModal, closeModal, submitForm, getStatusTag
        };
      },
      template: `
        <div class="app">
          <aside class="sidebar">
            <div class="brand">
              <div class="brand-mark">💎</div>
              <div class="brand-text">
                <div class="brand-name">懿珠宝管家</div>
                <div class="brand-sub">JEWELRY ERP</div>
              </div>
            </div>
            <div class="store-switch">
              <span class="store-ico">🏪</span>
              <div class="store-info">
                <div class="store-name">总店</div>
              </div>
              <span class="store-arrow">▾</span>
            </div>
            <nav>
              <div v-for="item in navItems" :key="item.key"
                   class="nav-item" :class="{ active: currentView === item.key }"
                   @click="currentView = item.key; loadData()">
                <span class="nav-ico">{{ item.ico }}</span>
                <span>{{ item.name }}</span>
              </div>
            </nav>
            <div class="sidebar-foot">
              <div class="avatar">管</div>
              <div class="foot-info">
                <div>管理员</div>
                <small>admin@jewelry.com</small>
              </div>
            </div>
          </aside>

          <main class="main">
            <header class="topbar">
              <div class="crumb">
                <span>懿珠宝管家</span>
                <span>/</span>
                <b>{{ viewTitle }}</b>
              </div>
              <div class="top-actions">
                <span class="store-pill">🏪 总店</span>
                <span class="top-date">{{ new Date().toLocaleDateString('zh-CN') }}</span>
              </div>
            </header>

            <div class="content">
              <div v-if="currentView === 'dashboard'">
                <div class="stat-cards">
                  <div class="stat-card">
                    <div class="stat-label">在售商品</div>
                    <div class="stat-value">{{ dashboard.total_products || 0 }}</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">库存成本</div>
                    <div class="stat-value gold">¥{{ (dashboard.inventory_cost || 0).toFixed(2) }}</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">今日销售</div>
                    <div class="stat-value">¥{{ (dashboard.today_sales || 0).toFixed(2) }}</div>
                    <div style="font-size:12px;color:var(--text-2);margin-top:4px;">{{ dashboard.today_orders || 0 }} 单</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">未收欠款</div>
                    <div class="stat-value" style="color:var(--red);">¥{{ (dashboard.unpaid_amount || 0).toFixed(2) }}</div>
                  </div>
                </div>
                <div class="card">
                  <div class="card-head">
                    <div class="card-title">最近销售</div>
                  </div>
                  <table class="data-table" v-if="dashboard.recent_sales && dashboard.recent_sales.length">
                    <thead><tr><th>订单号</th><th>金额</th><th>实收</th><th>时间</th></tr></thead>
                    <tbody>
                      <tr v-for="s in dashboard.recent_sales" :key="s.id">
                        <td>{{ s.order_no }}</td>
                        <td>¥{{ s.total_amount.toFixed(2) }}</td>
                        <td>¥{{ s.paid_amount.toFixed(2) }}</td>
                        <td>{{ s.created_at }}</td>
                      </tr>
                    </tbody>
                  </table>
                  <div v-else class="empty"><div class="empty-ico">📊</div><div>暂无销售记录</div></div>
                </div>
              </div>

              <div v-if="currentView === 'products'">
                <div class="search-bar">
                  <input v-model="searchKeyword" placeholder="搜索商品名称/编码" style="flex:1;">
                  <select v-model="filterStatus">
                    <option value="">全部状态</option>
                    <option value="在库">在库</option>
                    <option value="已定">已定</option>
                    <option value="借出">借出</option>
                    <option value="已完成">已完成</option>
                  </select>
                  <button class="btn btn-gold" @click="openModal('product')">+ 新增商品</button>
                </div>
                <div class="card">
                  <table class="data-table" v-if="products.length">
                    <thead><tr><th>商品编码</th><th>名称</th><th>分类</th><th>状态</th><th>售价</th><th>操作</th></tr></thead>
                    <tbody>
                      <tr v-for="p in products" :key="p.id">
                        <td>{{ p.product_code }}</td>
                        <td>{{ p.name }}</td>
                        <td>{{ p.category || '-' }}</td>
                        <td><span class="tag" :class="getStatusTag(p.status)">{{ p.status }}</span></td>
                        <td>¥{{ p.sell_price ? p.sell_price.toFixed(2) : '-' }}</td>
                        <td><button class="btn btn-outline" @click="openModal('product', p)">编辑</button></td>
                      </tr>
                    </tbody>
                  </table>
                  <div v-else class="empty"><div class="empty-ico">💍</div><div>暂无商品，点击新增</div></div>
                </div>
              </div>

              <div v-if="currentView === 'inventory'">
                <div class="card">
                  <div class="card-head"><div class="card-title">库存列表</div></div>
                  <table class="data-table" v-if="products.length">
                    <thead><tr><th>商品编码</th><th>名称</th><th>分类</th><th>状态</th><th>货位</th></tr></thead>
                    <tbody>
                      <tr v-for="p in products" :key="p.id">
                        <td>{{ p.product_code }}</td>
                        <td>{{ p.name }}</td>
                        <td>{{ p.category || '-' }}</td>
                        <td><span class="tag" :class="getStatusTag(p.status)">{{ p.status }}</span></td>
                        <td>{{ p.location || '-' }}</td>
                      </tr>
                    </tbody>
                  </table>
                  <div v-else class="empty"><div class="empty-ico">📦</div><div>暂无库存</div></div>
                </div>
              </div>

              <div v-if="currentView === 'sales'">
                <div class="search-bar">
                  <button class="btn btn-gold" @click="openModal('sale')">+ 销售开单</button>
                </div>
                <div class="card">
                  <table class="data-table" v-if="sales.length">
                    <thead><tr><th>订单号</th><th>总金额</th><th>实收</th><th>收款方式</th><th>状态</th><th>时间</th></tr></thead>
                    <tbody>
                      <tr v-for="s in sales" :key="s.id">
                        <td>{{ s.order_no }}</td>
                        <td>¥{{ s.total_amount.toFixed(2) }}</td>
                        <td>¥{{ s.paid_amount.toFixed(2) }}</td>
                        <td>{{ s.payment_method || '-' }}</td>
                        <td><span class="tag tag-green">{{ s.status }}</span></td>
                        <td>{{ s.created_at }}</td>
                      </tr>
                    </tbody>
                  </table>
                  <div v-else class="empty"><div class="empty-ico">🛒</div><div>暂无销售记录</div></div>
                </div>
              </div>

              <div v-if="currentView === 'deposits'">
                <div class="search-bar">
                  <button class="btn btn-gold" @click="openModal('deposit')">+ 收定金</button>
                </div>
                <div class="card">
                  <table class="data-table" v-if="deposits.length">
                    <thead><tr><th>定金金额</th><th>总金额</th><th>尾款</th><th>承诺交付日</th><th>状态</th><th>时间</th></tr></thead>
                    <tbody>
                      <tr v-for="d in deposits" :key="d.id">
                        <td>¥{{ d.deposit_amount.toFixed(2) }}</td>
                        <td>¥{{ d.total_amount.toFixed(2) }}</td>
                        <td style="color:var(--red);">¥{{ d.balance.toFixed(2) }}</td>
                        <td>{{ d.promise_date || '-' }}</td>
                        <td><span class="tag" :class="getStatusTag(d.status)">{{ d.status }}</span></td>
                        <td>{{ d.created_at }}</td>
                      </tr>
                    </tbody>
                  </table>
                  <div v-else class="empty"><div class="empty-ico">💰</div><div>暂无定金记录</div></div>
                </div>
              </div>

              <div v-if="currentView === 'customers'">
                <div class="search-bar">
                  <input v-model="searchKeyword" placeholder="搜索客户名称/手机号" style="flex:1;">
                  <button class="btn btn-gold" @click="openModal('customer')">+ 新增客户</button>
                </div>
                <div class="card">
                  <table class="data-table" v-if="customers.length">
                    <thead><tr><th>姓名</th><th>手机号</th><th>等级</th><th>累计消费</th><th>欠款</th><th>操作</th></tr></thead>
                    <tbody>
                      <tr v-for="c in customers" :key="c.id">
                        <td>{{ c.name }}</td>
                        <td>{{ c.phone || '-' }}</td>
                        <td><span class="tag tag-gold">{{ c.level }}</span></td>
                        <td>¥{{ (c.total_consumption || 0).toFixed(2) }}</td>
                        <td style="color:var(--red);">¥{{ (c.balance || 0).toFixed(2) }}</td>
                        <td><button class="btn btn-outline" @click="openModal('customer', c)">编辑</button></td>
                      </tr>
                    </tbody>
                  </table>
                  <div v-else class="empty"><div class="empty-ico">👥</div><div>暂无客户</div></div>
                </div>
              </div>

              <div v-if="currentView === 'stocktakes'">
                <div class="search-bar">
                  <button class="btn btn-gold" @click="openModal('stocktake')">+ 创建盘点单</button>
                </div>
                <div class="card">
                  <table class="data-table" v-if="stocktakes.length">
                    <thead><tr><th>盘点单号</th><th>类型</th><th>范围</th><th>状态</th><th>应盘/已盘</th><th>差异</th><th>时间</th></tr></thead>
                    <tbody>
                      <tr v-for="s in stocktakes" :key="s.id">
                        <td>{{ s.id }}</td>
                        <td>{{ s.type }}</td>
                        <td>{{ s.scope || '-' }}</td>
                        <td><span class="tag" :class="getStatusTag(s.status)">{{ s.status }}</span></td>
                        <td>{{ s.checked_items }}/{{ s.total_items }}</td>
                        <td style="color:var(--red);">{{ s.diff_count }}</td>
                        <td>{{ s.created_at }}</td>
                      </tr>
                    </tbody>
                  </table>
                  <div v-else class="empty"><div class="empty-ico">📋</div><div>暂无盘点单</div></div>
                </div>
              </div>

              <div v-if="currentView === 'logs'">
                <div class="card">
                  <div class="card-head"><div class="card-title">操作日志</div></div>
                  <table class="data-table" v-if="logs.length">
                    <thead><tr><th>操作</th><th>目标</th><th>详情</th><th>时间</th></tr></thead>
                    <tbody>
                      <tr v-for="l in logs" :key="l.id">
                        <td>{{ l.action }}</td>
                        <td>{{ l.target || '-' }}</td>
                        <td>{{ l.detail ? JSON.stringify(l.detail) : '-' }}</td>
                        <td>{{ l.created_at }}</td>
                      </tr>
                    </tbody>
                  </table>
                  <div v-else class="empty"><div class="empty-ico">📝</div><div>暂无日志</div></div>
                </div>
              </div>
            </div>
          </main>

          <div v-if="showModal" class="modal-overlay" @click.self="closeModal">
            <div class="modal">
              <div class="modal-head">
                <div class="modal-title">
                  {{ modalType === 'product' ? (formData.id ? '编辑商品' : '新增商品') : '' }}
                  {{ modalType === 'customer' ? (formData.id ? '编辑客户' : '新增客户') : '' }}
                  {{ modalType === 'sale' ? '销售开单' : '' }}
                  {{ modalType === 'deposit' ? '收定金' : '' }}
                  {{ modalType === 'stocktake' ? '创建盘点单' : '' }}
                </div>
                <span class="modal-close" @click="closeModal">×</span>
              </div>

              <div v-if="modalType === 'product'">
                <div class="form-group">
                  <label class="form-label">商品名称</label>
                  <input class="form-input" v-model="formData.name" placeholder="请输入商品名称">
                </div>
                <div class="form-group">
                  <label class="form-label">分类</label>
                  <input class="form-input" v-model="formData.category" placeholder="如：戒指、项链">
                </div>
                <div class="form-group">
                  <label class="form-label">材质</label>
                  <input class="form-input" v-model="formData.material" placeholder="如：18K金、铂金">
                </div>
                <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                  <div>
                    <label class="form-label">成本价</label>
                    <input class="form-input" type="number" v-model.number="formData.cost_price" placeholder="0.00">
                  </div>
                  <div>
                    <label class="form-label">售价</label>
                    <input class="form-input" type="number" v-model.number="formData.sell_price" placeholder="0.00">
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">货位</label>
                  <input class="form-input" v-model="formData.location" placeholder="如：A区-01">
                </div>
              </div>

              <div v-if="modalType === 'customer'">
                <div class="form-group">
                  <label class="form-label">客户姓名</label>
                  <input class="form-input" v-model="formData.name" placeholder="请输入客户姓名">
                </div>
                <div class="form-group">
                  <label class="form-label">手机号</label>
                  <input class="form-input" v-model="formData.phone" placeholder="请输入手机号">
                </div>
                <div class="form-group">
                  <label class="form-label">等级</label>
                  <select class="form-input" v-model="formData.level">
                    <option value="普通">普通</option>
                    <option value="银卡">银卡</option>
                    <option value="金卡">金卡</option>
                    <option value="VIP">VIP</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">偏好</label>
                  <input class="form-input" v-model="formData.preference" placeholder="如：喜欢黄金、偏爱戒指">
                </div>
              </div>

              <div v-if="modalType === 'sale'">
                <div class="form-group">
                  <label class="form-label">客户 ID（可选）</label>
                  <input class="form-input" type="number" v-model.number="formData.customer_id" placeholder="留空表示散客">
                </div>
                <div class="form-group">
                  <label class="form-label">收款方式</label>
                  <select class="form-input" v-model="formData.payment_method">
                    <option value="现金">现金</option>
                    <option value="微信">微信</option>
                    <option value="支付宝">支付宝</option>
                    <option value="刷卡">刷卡</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">商品 ID 列表（JSON 格式）</label>
                  <textarea class="form-input" v-model="formData.items_json" placeholder='[{"product_id":1,"price":1000}]' rows="3"></textarea>
                </div>
              </div>

              <div v-if="modalType === 'deposit'">
                <div class="form-group">
                  <label class="form-label">商品 ID</label>
                  <input class="form-input" type="number" v-model.number="formData.product_id" placeholder="请输入商品ID">
                </div>
                <div class="form-group">
                  <label class="form-label">客户 ID（可选）</label>
                  <input class="form-input" type="number" v-model.number="formData.customer_id" placeholder="留空表示散客">
                </div>
                <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                  <div>
                    <label class="form-label">定金金额</label>
                    <input class="form-input" type="number" v-model.number="formData.deposit_amount" placeholder="0.00">
                  </div>
                  <div>
                    <label class="form-label">总金额</label>
                    <input class="form-input" type="number" v-model.number="formData.total_amount" placeholder="0.00">
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">承诺交付日</label>
                  <input class="form-input" type="date" v-model="formData.promise_date">
                </div>
              </div>

              <div v-if="modalType === 'stocktake'">
                <div class="form-group">
                  <label class="form-label">盘点类型</label>
                  <select class="form-input" v-model="formData.type">
                    <option value="全盘">全盘</option>
                    <option value="抽盘">抽盘</option>
                    <option value="循环">循环</option>
                    <option value="指定">指定</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">范围</label>
                  <input class="form-input" v-model="formData.scope" placeholder="如：全部、A区">
                </div>
                <div class="form-group">
                  <label class="form-label">采集方式</label>
                  <select class="form-input" v-model="formData.method">
                    <option value="scan">扫码</option>
                    <option value="scan-batch">连续扫码</option>
                    <option value="manual">手动</option>
                    <option value="rfid">RFID</option>
                  </select>
                </div>
              </div>

              <div class="form-actions">
                <button class="btn btn-outline" @click="closeModal">取消</button>
                <button class="btn btn-gold" @click="submitForm">确认</button>
              </div>
            </div>
          </div>
        </div>
      `
    }).mount('#app');
  </script>
</body>
</html>
