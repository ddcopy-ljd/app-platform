<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UHF Stocktake</title>
<script src="i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#0a0a0a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:12px; }

  .hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .hdr h1 { font-size:18px; }
  .hdr .lang { background:#222; border:1px solid #444; border-radius:6px; padding:4px 10px; font-size:12px; color:#aaa; cursor:pointer; }

  .status-bar { display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:12px; }
  .status-dot { width:8px; height:8px; border-radius:50%; background:#555; box-shadow:0 0 6px #555; transition:.3s; }
  .status-dot.ok { background:#4CAF50; box-shadow:0 0 6px #4CAF50; }
  .status-dot.warn { background:#FF9800; box-shadow:0 0 6px #FF9800; }
  .status-dot.err { background:#F44336; box-shadow:0 0 6px #F44336; }
  .status-txt { color:#888; transition:.3s; }
  .status-txt.ok { color:#4CAF50; }
  .status-txt.warn { color:#FF9800; }
  .status-txt.err { color:#F44336; }

  .card { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; padding:12px; margin-bottom:10px; }
  .card-title { font-size:12px; color:#888; margin-bottom:8px; font-weight:bold; }
  .card-hint { font-size:10px; color:#555; margin-top:4px; }
  .input-row { display:flex; gap:8px; }
  .input-row input, .input-row select { flex:1; background:#111; border:1px solid #333; border-radius:8px; padding:8px 10px; color:#ddd; font-size:13px; outline:none; }
  .input-row button { background:#2a2a2a; border:1px solid #444; border-radius:8px; padding:8px 14px; color:#ddd; font-size:12px; font-weight:bold; cursor:pointer; }
  .input-row button:active { transform:scale(.96); }
  .input-row button.primary { background:#2196F3; border-color:#2196F3; color:#fff; }
  .input-row button.success { background:#4CAF50; border-color:#4CAF50; color:#fff; }
  .input-row button.danger { background:#E53935; border-color:#E53935; color:#fff; }

  .ctrl { display:flex; justify-content:space-between; align-items:center; }
  .ctrl-info { flex:1; }
  .ctrl-state { font-size:16px; font-weight:bold; color:#fff; margin-bottom:2px; }
  .ctrl-sub { font-size:11px; color:#666; }
  .ctrl-btns { display:flex; gap:6px; }
  .btn { border:none; border-radius:8px; padding:10px 16px; font-size:13px; font-weight:bold; cursor:pointer; transition:.15s; }
  .btn:active { transform:scale(.95); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn-start { background:#4CAF50; color:#fff; }
  .btn-pause { background:#333; color:#888; }
  .btn-resume { background:#2196F3; color:#fff; }
  .btn-stop { background:#E53935; color:#fff; }
  .btn-hidden { display:none; }

  .stats { display:flex; gap:8px; margin-bottom:10px; }
  .stat { flex:1; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:10px; padding:10px; text-align:center; }
  .stat-val { font-size:20px; font-weight:bold; color:#4CAF50; }
  .stat-lbl { font-size:10px; color:#666; margin-top:2px; }
  .stat-val.warn { color:#FF9800; }
  .stat-val.err { color:#F44336; }

  .list-hdr { display:flex; justify-content:space-between; align-items:center; padding:4px 0 8px; }
  .list-title { font-size:14px; font-weight:bold; color:#ccc; }
  .list-act { display:flex; gap:6px; }
  .list-act .btn { padding:4px 10px; font-size:11px; }

  .list-item { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:10px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .list-epc { font-family:'SF Mono',Consolas,monospace; font-size:12px; font-weight:bold; color:#fff; word-break:break-all; flex:1; }
  .list-meta { text-align:right; font-size:10px; color:#666; white-space:nowrap; margin-left:8px; }
  .list-count { font-size:14px; font-weight:bold; color:#4CAF50; }

  .empty { text-align:center; padding:30px 20px; color:#444; font-size:12px; }

  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; justify-content:center; align-items:center; z-index:100; backdrop-filter:blur(4px); }
  .modal-mask.show { display:flex; }
  .modal { background:#1e1e1e; border:1px solid #333; border-radius:16px; padding:20px; width:340px; max-width:90vw; max-height:80vh; overflow-y:auto; }
  .modal h3 { font-size:15px; margin-bottom:12px; color:#fff; }
  .modal-close { float:right; font-size:18px; color:#888; cursor:pointer; }
  .modal-row { display:flex; justify-content:space-between; padding:6px 0; font-size:12px; border-bottom:1px solid #2a2a2a; }
  .modal-row:last-child { border:none; }
  .modal-k { color:#888; }
  .modal-v { color:#fff; font-weight:bold; }
  .modal-v.ok { color:#4CAF50; }
  .modal-v.warn { color:#FF9800; }
  .modal-v.err { color:#F44336; }
  .modal-btn { width:100%; margin-top:12px; padding:10px; border:none; border-radius:8px; background:#2a2a2a; color:#ddd; font-weight:bold; cursor:pointer; }
  .modal-btn.primary { background:#4CAF50; color:#fff; }
  .modal-btn.danger { background:#E53935; color:#fff; }

  .progress { background:#2a2a2a; border-radius:6px; height:8px; margin:10px 0; overflow:hidden; }
  .progress-fill { background:#4CAF50; height:100%; width:0%; transition:width .3s; border-radius:6px; }
  .progress-txt { font-size:11px; color:#888; text-align:center; margin-top:4px; }

  .result-sect { margin-bottom:10px; }
  .result-sect h4 { font-size:12px; color:#FF9800; margin-bottom:4px; }
  .result-item { font-size:11px; color:#ccc; padding:3px 0; border-bottom:1px solid #2a2a2a; font-family:monospace; }
  .badge { display:inline-block; padding:1px 6px; border-radius:4px; font-size:10px; font-weight:bold; margin-left:4px; }
  .badge.ok { background:#1b3a1b; color:#4CAF50; }
  .badge.warn { background:#3a2a1b; color:#FF9800; }
  .badge.err { background:#3a1b1b; color:#F44336; }

  .pending-badge { display:inline-block; background:#E53935; color:#fff; font-size:10px; padding:1px 6px; border-radius:8px; margin-left:4px; }

  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px); background:#333; color:#fff; padding:8px 16px; border-radius:8px; font-size:12px; opacity:0; transition:.3s; z-index:200; pointer-events:none; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1 data-i18n="appTitle">UHF 盘点助手</h1>
    <div class="lang" id="langBtn" onclick="toggleLang()">EN</div>
  </div>

  <div class="status-bar" id="rfidStatus">
    <div class="status-dot" id="rfidDot"></div>
    <span class="status-txt" id="rfidText" data-i18n="disconnected">RFID 未就绪</span>
  </div>

  <div class="card">
    <div class="card-title" data-i18n="serverUrl">服务器接口地址</div>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="http://192.168.1.20:8002/api/stocktake/upload?key=xxx">
      <button class="primary" onclick="saveUrl()" data-i18n="saveUrl">保存</button>
    </div>
    <div class="card-hint" data-i18n="urlTip">从盘点页二维码旁复制接口地址粘贴到这里</div>
  </div>

  <div class="card">
    <div class="card-title" data-i18n="powerLabel">功率 (dBm)</div>
    <div class="input-row">
      <select id="powerSelect" onchange="setPower()">
        <option value="5">5 dBm</option>
        <option value="10">10 dBm</option>
        <option value="15">15 dBm</option>
        <option value="20">20 dBm</option>
        <option value="25" selected>25 dBm</option>
        <option value="30">30 dBm</option>
      </select>
      <input type="text" id="deviceName" placeholder="PDA-01" value="" data-i18n-ph="deviceDefault">
    </div>
  </div>

  <div class="card">
    <div class="ctrl">
      <div class="ctrl-info">
        <div class="ctrl-state" id="ctrlState" data-i18n="statusIdle">未开始</div>
        <div class="ctrl-sub" id="ctrlSub" data-i18n="statusIdleSub">按住扫描键 或 点击【开始盘点】</div>
      </div>
      <div class="ctrl-btns">
        <button class="btn btn-start" id="btnStart" onclick="startScan()" data-i18n="btnStart">开始盘点</button>
        <button class="btn btn-pause btn-hidden" id="btnPause" onclick="pauseScan()" data-i18n="btnPause">暂停</button>
        <button class="btn btn-resume btn-hidden" id="btnResume" onclick="resumeScan()" data-i18n="btnResume">继续</button>
        <button class="btn btn-stop" id="btnStop" onclick="stopScan()" data-i18n="btnStop">结束并上传</button>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="statTotal">0</div>
      <div class="stat-lbl" data-i18n="statScanned">已扫</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statUnique">0</div>
      <div class="stat-lbl" data-i18n="statUnique">唯一标签</div>
    </div>
    <div class="stat">
      <div class="stat-val warn" id="statPending">0</div>
      <div class="stat-lbl" data-i18n="pendingQueue">待传队列</div>
    </div>
  </div>

  <div class="list-hdr">
    <span class="list-title" data-i18n="tabList">扫描明细</span>
    <div class="list-act">
      <button class="btn" onclick="showResult()" id="btnResult" style="display:none">结果</button>
      <button class="btn" onclick="showPending()" data-i18n="retryNow">重传</button>
      <button class="btn" onclick="clearList()" data-i18n="clearList">清空</button>
    </div>
  </div>
  <div id="scanList"><div class="empty" data-i18n="emptyList">暂无盘点数据</div></div>
</div>

<!-- Upload Modal -->
<div class="modal-mask" id="uploadModal">
  <div class="modal">
    <h3><span data-i18n="uploading">正在上传盘点结果…</span></h3>
    <div class="progress"><div class="progress-fill" id="progBar"></div></div>
    <div class="progress-txt" id="progTxt">0 / 0</div>
    <button class="modal-btn" onclick="closeModal('uploadModal')" data-i18n="close">关闭</button>
  </div>
</div>

<!-- Result Modal -->
<div class="modal-mask" id="resultModal">
  <div class="modal">
    <h3><span data-i18n="resultTitle">盘点结果</span><span class="modal-close" onclick="closeModal('resultModal')">×</span></h3>
    <div class="modal-row"><span class="modal-k" data-i18n="resScanned">扫描</span><span class="modal-v" id="resScanned">0</span></div>
    <div class="modal-row"><span class="modal-k" data-i18n="resBook">账面</span><span class="modal-v" id="resBook">0</span></div>
    <div class="modal-row"><span class="modal-k" data-i18n="resMatched">相符</span><span class="modal-v ok" id="resMatched">0</span></div>
    <div class="modal-row"><span class="modal-k" data-i18n="resSurplus">盘盈</span><span class="modal-v warn" id="resSurplus">0</span></div>
    <div class="modal-row"><span class="modal-k" data-i18n="resShortage">盘亏</span><span class="modal-v err" id="resShortage">0</span></div>
    <div class="modal-row"><span class="modal-k" data-i18n="resAbnormal">异常</span><span class="modal-v err" id="resAbnormal">0</span></div>
    <div id="resDetail"></div>
    <button class="modal-btn primary" onclick="closeModal('resultModal')" data-i18n="close">关闭</button>
  </div>
</div>

<!-- Pending Modal -->
<div class="modal-mask" id="pendingModal">
  <div class="modal">
    <h3><span data-i18n="pendingQueue">待传队列</span><span class="modal-close" onclick="closeModal('pendingModal')">×</span></h3>
    <div id="pendingList" style="max-height:300px; overflow-y:auto;"></div>
    <button class="modal-btn primary" onclick="retryAll()" data-i18n="retryNow">立即重传</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
