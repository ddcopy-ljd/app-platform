plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 正式签名：keystore 由 CI 首次构建时生成并提交到 app/release.jks（私有仓库）。
def releaseKeystore = file('release.jks')
def ksStorePass = project.findProperty('YIZHEN_KS_PASS') ?: 'yizhen_rfid_2026'
def ksKeyPass = project.findProperty('YIZHEN_KEY_PASS') ?: 'yizhen_rfid_2026'

android {
    namespace 'com.yizhen.rfid'
    compileSdk 34

    defaultConfig {
        applicationId "com.yizhen.rfid"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.3.1"
    }

    signingConfigs {
        if (releaseKeystore.exists()) {
            release {
                storeFile releaseKeystore
                storeType 'PKCS12'
                storePassword ksStorePass
                keyAlias 'yizhen'
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // C27 RFID SDK (local AAR)
    implementation(name: 'DeviceAPI_ver20220518_release', ext: 'aar')
}
